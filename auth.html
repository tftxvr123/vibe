<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Login | VIBE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body{background:#020617; color:white; font-family:'Plus Jakarta Sans',sans-serif;}</style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">
    <div class="w-full max-w-sm bg-white/5 p-8 rounded-[2.5rem] border border-white/10">
        <h2 class="text-3xl font-black mb-8 text-center uppercase italic">Join Vibe</h2>
        <div class="space-y-4 mb-6">
            <input id="email" type="email" placeholder="Email" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none">
            <input id="pass" type="password" placeholder="Password" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none">
            <input id="nick" type="text" placeholder="Your Nickname" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none">
        </div>
        <button id="auth-btn" class="w-full bg-indigo-600 py-4 rounded-xl font-bold mb-4">CONTINUE</button>
        <p class="text-center text-[10px] text-slate-500">Log in or Sign up to add friends</p>
    </div>

    <script type="module">
        import { auth, db, set, ref } from './config.js';
        import { createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        document.getElementById('auth-btn').onclick = async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            const nick = document.getElementById('nick').value;

            try {
                const res = await createUserWithEmailAndPassword(auth, email, pass);
                await set(ref(db, 'users/' + res.user.uid), { nickname: nick, email });
                location.href = 'index.html';
            } catch (e) {
                try {
                    await signInWithEmailAndPassword(auth, email, pass);
                    location.href = 'index.html';
                } catch (err) { alert(err.message); }
            }
        };
    </script>
</body>
</html>
