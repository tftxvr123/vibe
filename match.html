<script type="module">
    import { db, auth, ref, set, onValue, get, remove, getMyUID } from './config.js';

    const myUID = auth.currentUser ? auth.currentUser.uid : getMyUID();
    const interests = JSON.parse(localStorage.getItem('vibe_interests'));
    const prefs = JSON.parse(localStorage.getItem('vibe_prefs'));

    // 1. Join Lobby
    const lobbyRef = ref(db, 'lobby/' + myUID);
    set(lobbyRef, { id: myUID, interests, prefs, time: Date.now() });

    // 2. Look for matches
    onValue(ref(db, 'lobby'), (snap) => {
        const users = snap.val();
        if(!users) return;
        Object.keys(users).forEach(peerId => {
            if(peerId === myUID) return;
            const peer = users[peerId];
            const common = peer.interests.filter(i => interests.includes(i));
            if(common.length > 0) {
                const roomId = [myUID, peerId].sort().join('_');
                // Set match for both
                set(ref(db, `lobby/${peerId}/match`), { roomId, style: prefs.style, peerUID: myUID });
                set(ref(db, `lobby/${myUID}/match`), { roomId, style: prefs.style, peerUID: peerId });
                window.location.href = `chat.html?room=${roomId}&peer=${peerId}&style=${prefs.style}`;
            }
        });
    });

    // 3. Listen for matches assigned to me
    onValue(ref(db, `lobby/${myUID}/match`), (snap) => {
        const data = snap.val();
        if(data) window.location.href = `chat.html?room=${data.roomId}&peer=${data.peerUID}&style=${data.style}`;
    });

    // Inside match.html <script>
// When a match is found, ensure the URL looks like this:
const roomId = [myUID, peerId].sort().join('_');
window.location.href = `chat.html?room=${roomId}&peer=${peerId}&style=${prefs.style}`;
</script>
