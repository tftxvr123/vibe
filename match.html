<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar | VIBE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans'; background: #000; color: white; overflow: hidden; }
        .radar-pulse { position: absolute; border: 2px solid #6366f1; border-radius: 50%; animation: pulse 4s cubic-bezier(0, 0.2, 0.8, 1) infinite; opacity: 0; }
        @keyframes pulse { 0% { width: 0; height: 0; opacity: 1; } 100% { width: 500px; height: 500px; opacity: 0; } }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-6 text-center">

    <div class="relative w-64 h-64 flex items-center justify-center mb-12">
        <div class="radar-pulse"></div>
        <div class="radar-pulse" style="animation-delay: 1s;"></div>
        <div class="relative z-10 w-24 h-24 bg-indigo-600 rounded-[2.5rem] flex items-center justify-center shadow-2xl border border-white/20">
            <i data-lucide="compass" class="w-12 h-12 text-white animate-spin [animation-duration:5s]"></i>
        </div>
    </div>

    <h2 class="text-3xl font-black italic uppercase tracking-tighter mb-2">Scanning...</h2>
    <p id="status-msg" class="text-indigo-400 text-[10px] font-bold uppercase tracking-[0.4em] animate-pulse">Establishing Connection</p>

    <!-- BUTTONS - NO ONCLICK HERE, HANDLED BY SCRIPT -->
    <button id="btn-cancel" class="fixed bottom-12 px-8 py-3 bg-white/5 border border-white/10 rounded-xl text-[10px] font-bold uppercase tracking-widest hover:bg-red-500 hover:text-white transition-all">
        Cancel Search
    </button>

    <script type="module">
        import { db, auth, ref, set, onValue, remove, getMyUID, onAuthStateChanged, get, off } from './config.js';

        const statusLabel = document.getElementById('status-msg');
        
        // --- 1. THE BUTTON FIX ---
        document.getElementById('btn-cancel').addEventListener('click', () => {
            window.location.href = 'index.html';
        });

        onAuthStateChanged(auth, async (user) => {
            const myUID = user ? user.uid : getMyUID();
            const myInterests = JSON.parse(localStorage.getItem('vibe_interests')) || ["General"];
            
            // CLEAN OLD DATA
            await remove(ref(db, `lobby/${myUID}`));

            // --- 2. LISTEN FOR MATCHES (JOINER MODE) ---
            const matchRef = ref(db, `lobby/${myUID}/match`);
            onValue(matchRef, (snap) => {
                const data = snap.val();
                if (data && data.roomId) {
                    off(matchRef); // Stop listening
                    window.location.href = `chat.html?room=${data.roomId}&peer=${data.peerId}`;
                }
            });

            // --- 3. TRY TO FIND SOMEONE (CREATOR MODE) ---
            statusLabel.innerText = "Searching for wavelengths...";
            const lobbySnap = await get(ref(db, 'lobby'));
            const users = lobbySnap.val();
            let matched = false;

            if (users) {
                for (let peerId in users) {
                    if (peerId === myUID) continue;
                    const peer = users[peerId];
                    if (peer.match) continue; // Already busy

                    const shared = peer.interests.filter(i => myInterests.includes(i));
                    if (shared.length > 0) {
                        matched = true;
                        const roomId = [myUID, peerId].sort().join('_');
                        
                        // Handshake
                        await set(ref(db, `lobby/${peerId}/match`), { roomId, peerId: myUID });
                        await set(ref(db, `lobby/${myUID}/match`), { roomId, peerId: peerId });
                        window.location.href = `chat.html?room=${roomId}&peer=${peerId}`;
                        break;
                    }
                }
            }

            // --- 4. NO ONE FOUND? WAIT ---
            if (!matched) {
                statusLabel.innerText = "Waiting for a match...";
                await set(ref(db, `lobby/${myUID}`), {
                    interests: myInterests,
                    status: 'searching',
                    time: Date.now()
                });
            }
        });

        lucide.createIcons();
    </script>
</body>
</html>
