<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>VIBE | Matching</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=swap'); body{font-family:'Plus Jakarta Sans'; background:#000; color:white; overflow:hidden;}</style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-6">

    <div class="relative w-48 h-48 flex items-center justify-center mb-12">
        <div class="absolute inset-0 border-2 border-indigo-500 rounded-full animate-ping opacity-20"></div>
        <div class="w-20 h-20 bg-indigo-600 rounded-3xl flex items-center justify-center shadow-2xl animate-spin [animation-duration:8s]">
            <i data-lucide="zap" class="w-10 h-10 text-white"></i>
        </div>
    </div>

    <h2 id="status-text" class="text-3xl font-black italic uppercase tracking-tighter mb-2">Searching...</h2>
    <p id="debug-log" class="text-indigo-400 text-[10px] font-mono uppercase opacity-50 tracking-widest">Initializing...</p>

    <!-- CANCEL -->
    <button onclick="window.cancelSearch()" class="fixed bottom-12 text-slate-500 text-xs font-bold uppercase tracking-widest hover:text-white">Cancel</button>

    <script type="module">
        import { db, auth, ref, set, onValue, remove, getMyUID, onAuthStateChanged, get, off } from './config.js';

        const log = (msg) => { document.getElementById('debug-log').innerText = msg; console.log(msg); };

        onAuthStateChanged(auth, async (user) => {
            const myUID = user ? user.uid : getMyUID();
            const myInterests = JSON.parse(localStorage.getItem('vibe_interests')) || ["General"];
            
            log("ID: " + myUID + " | Interests: " + myInterests.join(','));

            // 1. Wipe any previous match pings
            await remove(ref(db, `matches/${myUID}`));

            // 2. Watch for someone to match with ME
            const matchPingRef = ref(db, `matches/${myUID}`);
            onValue(matchPingRef, (snap) => {
                const data = snap.val();
                if(data && data.roomId) {
                    log("MATCH RECEIVED! Redir...");
                    off(matchPingRef);
                    window.location.href = `chat.html?room=${data.roomId}&peer=${data.peerId}`;
                }
            });

            // 3. Scan the "Waitlist" to see if a stranger is already there
            const waitlistRef = ref(db, 'waitlist');
            const snapshot = await get(waitlistRef);

            let foundPeer = null;
            if(snapshot.exists()) {
                const users = snapshot.val();
                for (let uid in users) {
                    if (uid === myUID) continue;
                    // Matching Logic: Shared Interests?
                    const peerInterests = users[uid].interests || [];
                    const common = peerInterests.filter(i => myInterests.includes(i));
                    
                    if (common.length > 0) {
                        foundPeer = { uid, ...users[uid] };
                        break; 
                    }
                }
            }

            if(foundPeer) {
                log("FOUND STRANGER: " + foundPeer.uid);
                const roomId = [myUID, foundPeer.uid].sort().join('_');

                // A. Remove them from waitlist so no one else grabs them
                await remove(ref(db, `waitlist/${foundPeer.uid}`));

                // B. Ping THEM with the match
                await set(ref(db, `matches/${foundPeer.uid}`), { roomId, peerId: myUID });

                // C. Join the chat myself
                window.location.href = `chat.html?room=${roomId}&peer=${foundPeer.uid}`;
            } else {
                log("WAITING IN LOBBY...");
                // No one found? Put myself on the waitlist
                await set(ref(db, `waitlist/${myUID}`), {
                    interests: myInterests,
                    time: Date.now()
                });
            }
        });

        window.cancelSearch = () => {
            localStorage.removeItem('vibe_temp_id'); // Optional: reset ID on cancel
            window.location.href = 'index.html';
        };

        lucide.createIcons();
    </script>
</body>
</html>
