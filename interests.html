<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Interests | VIBE</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
    <!-- NAV HEADER -->
<nav class="fixed top-0 w-full z-50 bg-[#020617]/80 backdrop-blur-md border-b border-white/5 h-16 flex items-center justify-between px-6">
    <div class="flex items-center gap-4">
        <!-- Back Button -->
        <button onclick="history.back()" class="text-slate-400 hover:text-white transition-colors">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </button>
        <!-- Home Link -->
        <a href="index.html" class="flex items-center gap-2 font-black italic text-lg tracking-tighter">
            <div class="w-7 h-7 bg-indigo-600 rounded-lg flex items-center justify-center"><i data-lucide="zap" class="w-4 h-4 fill-current"></i></div>
            VIBE
        </a>
    </div>
    
    <div id="nav-user-actions" class="flex items-center gap-4">
        <!-- Will be filled by JavaScript -->
    </div>
</nav>

<script type="module">
    import { auth, onAuthStateChanged, logoutUser } from './config.js';
    
    // Listen for Auth State
    onAuthStateChanged(auth, (user) => {
        const actionArea = document.getElementById('nav-user-actions');
        if (user) {
            actionArea.innerHTML = `
                <a href="social.html" class="text-slate-400 hover:text-white"><i data-lucide="users" class="w-5 h-5"></i></a>
                <button id="logout-btn" class="text-xs font-bold uppercase tracking-widest text-red-500 hover:text-red-400">Logout</button>
            `;
            document.getElementById('logout-btn').onclick = logoutUser;
        } else {
            actionArea.innerHTML = `<a href="auth.html" class="text-xs font-bold uppercase tracking-widest text-indigo-400">Login</a>`;
        }
        lucide.createIcons();
    });
</script>
<body class="bg-[#020617] text-white p-6 pt-32">
    <div class="max-w-md mx-auto">
        <h2 class="text-4xl font-black mb-10">What's your vibe?</h2>
        <div class="bg-white/5 p-6 rounded-3xl border border-white/10">
            <div id="tag-container" class="flex flex-wrap gap-2 mb-4"></div>
            <input id="tag-input" type="text" placeholder="Add an interest..." class="w-full bg-transparent outline-none text-xl">
        </div>
        <button id="next-btn" disabled onclick="location.href='prefs.html'" class="w-full mt-10 bg-indigo-600 py-5 rounded-2xl font-bold opacity-20">CONTINUE</button>
    </div>
    <script>
        let tags = [];
        const input = document.getElementById('tag-input');
        input.addEventListener('keydown', (e) => {
            if(e.key === 'Enter' && input.value.trim()){
                tags.push(input.value.trim().toLowerCase());
                input.value = '';
                render();
            }
        });
        function render() {
            document.getElementById('tag-container').innerHTML = tags.map(t => `<span class="bg-indigo-600 px-3 py-1 rounded-lg text-xs font-bold">${t}</span>`).join(' ');
            document.getElementById('next-btn').disabled = tags.length < 1;
            document.getElementById('next-btn').style.opacity = tags.length < 1 ? "0.2" : "1";
            localStorage.setItem('vibe_interests', JSON.stringify(tags));
        }
    </script>
</body>
</html>
