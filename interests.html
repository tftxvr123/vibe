<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Interests | VIBE</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#020617] text-white p-6 pt-32">
    <div class="max-w-md mx-auto">
        <h2 class="text-4xl font-black mb-10">What's your vibe?</h2>
        <div class="bg-white/5 p-6 rounded-3xl border border-white/10">
            <div id="tag-container" class="flex flex-wrap gap-2 mb-4"></div>
            <input id="tag-input" type="text" placeholder="Add an interest..." class="w-full bg-transparent outline-none text-xl">
        </div>
        <button id="next-btn" disabled onclick="location.href='prefs.html'" class="w-full mt-10 bg-indigo-600 py-5 rounded-2xl font-bold opacity-20">CONTINUE</button>
    </div>
    <script>
        let tags = [];
        const input = document.getElementById('tag-input');
        input.addEventListener('keydown', (e) => {
            if(e.key === 'Enter' && input.value.trim()){
                tags.push(input.value.trim().toLowerCase());
                input.value = '';
                render();
            }
        });
        function render() {
            document.getElementById('tag-container').innerHTML = tags.map(t => `<span class="bg-indigo-600 px-3 py-1 rounded-lg text-xs font-bold">${t}</span>`).join(' ');
            document.getElementById('next-btn').disabled = tags.length < 1;
            document.getElementById('next-btn').style.opacity = tags.length < 1 ? "0.2" : "1";
            localStorage.setItem('vibe_interests', JSON.stringify(tags));
        }
    </script>
</body>
</html>
