<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Friends | VIBE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>body{background:#020617; color:white; font-family:'Plus Jakarta Sans',sans-serif;}</style>
</head>
<body class="p-6 pt-24">
    
    <nav class="fixed top-0 left-0 w-full p-6 flex items-center gap-4 bg-[#020617]/80 backdrop-blur-md border-b border-white/5">
        <a href="index.html" class="text-slate-400"><i data-lucide="arrow-left"></i></a>
        <h1 class="text-xl font-black italic">YOUR CIRCLE</h1>
    </nav>

    <div class="max-w-md mx-auto">
        <div id="friends-list" class="space-y-3">
            <!-- Friends will be loaded here -->
            <p id="loading-text" class="text-center text-slate-500 py-20 animate-pulse uppercase text-[10px] font-bold tracking-widest">Loading Friends...</p>
        </div>
    </div>

    <script type="module">
        import { auth, db, ref, onValue, get, onAuthStateChanged } from './config.js';

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'auth.html';
                return;
            }

            const friendsRef = ref(db, `friends/${user.uid}`);
            onValue(friendsRef, async (snap) => {
                const list = document.getElementById('friends-list');
                list.innerHTML = '';
                
                if (!snap.exists()) {
                    list.innerHTML = `<div class="text-center py-20 text-slate-500 italic text-sm">No friends added yet. Chat with people to grow your circle.</div>`;
                    return;
                }

                Object.keys(snap.val()).forEach(async (fuid) => {
                    const userSnap = await get(ref(db, `users/${fuid}`));
                    if (userSnap.exists()) {
                        const friend = userSnap.val();
                        const roomId = [user.uid, fuid].sort().join('_');
                        
                        const div = document.createElement('div');
                        div.className = "bg-white/5 border border-white/10 p-5 rounded-[1.5rem] flex justify-between items-center hover:bg-white/10 transition-all cursor-pointer";
                        div.onclick = () => location.href = `chat.html?room=${roomId}&peer=${fuid}`;
                        div.innerHTML = `
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 bg-indigo-600 rounded-xl flex items-center justify-center font-black">${friend.nickname[0].toUpperCase()}</div>
                                <div>
                                    <div class="font-bold text-white">${friend.nickname}</div>
                                    <div class="text-[9px] text-green-500 font-bold uppercase tracking-widest">Friend</div>
                                </div>
                            </div>
                            <i data-lucide="message-circle" class="text-slate-500"></i>
                        `;
                        list.appendChild(div);
                        lucide.createIcons();
                    }
                });
            });
        });
        lucide.createIcons();
    </script>
</body>
</html>
