<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Friends | VIBE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body{background:#020617; color:white; font-family:'Plus Jakarta Sans',sans-serif;}</style>
</head>
    <!-- NAV HEADER -->
<nav class="fixed top-0 w-full z-50 bg-[#020617]/80 backdrop-blur-md border-b border-white/5 h-16 flex items-center justify-between px-6">
    <div class="flex items-center gap-4">
        <!-- Back Button -->
        <button onclick="history.back()" class="text-slate-400 hover:text-white transition-colors">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </button>
        <!-- Home Link -->
        <a href="index.html" class="flex items-center gap-2 font-black italic text-lg tracking-tighter">
            <div class="w-7 h-7 bg-indigo-600 rounded-lg flex items-center justify-center"><i data-lucide="zap" class="w-4 h-4 fill-current"></i></div>
            VIBE
        </a>
    </div>
    
    <div id="nav-user-actions" class="flex items-center gap-4">
        <!-- Will be filled by JavaScript -->
    </div>
</nav>

<script type="module">
    import { auth, onAuthStateChanged, logoutUser } from './config.js';
    
    // Listen for Auth State
    onAuthStateChanged(auth, (user) => {
        const actionArea = document.getElementById('nav-user-actions');
        if (user) {
            actionArea.innerHTML = `
                <a href="social.html" class="text-slate-400 hover:text-white"><i data-lucide="users" class="w-5 h-5"></i></a>
                <button id="logout-btn" class="text-xs font-bold uppercase tracking-widest text-red-500 hover:text-red-400">Logout</button>
            `;
            document.getElementById('logout-btn').onclick = logoutUser;
        } else {
            actionArea.innerHTML = `<a href="auth.html" class="text-xs font-bold uppercase tracking-widest text-indigo-400">Login</a>`;
        }
        lucide.createIcons();
    });
</script>
<body class="p-6 pt-24">
    <div class="max-w-md mx-auto">
        <h2 class="text-3xl font-black mb-8 uppercase italic">Your Circle</h2>
        <div id="list" class="space-y-3">
            <p class="text-slate-500 text-center py-10 italic">Login to see your friends.</p>
        </div>
    </div>

    <script type="module">
        import { auth, db, ref, onValue, get, onAuthStateChanged } from './config.js';

        onAuthStateChanged(auth, (user) => {
            if(!user) return;
            onValue(ref(db, `friends/${user.uid}`), (snap) => {
                const container = document.getElementById('list');
                container.innerHTML = '';
                if(!snap.exists()){
                    container.innerHTML = '<p class="text-slate-500 text-center">No friends added yet.</p>';
                    return;
                }
                Object.keys(snap.val()).forEach(async (fuid) => {
                    const usnap = await get(ref(db, 'users/' + fuid));
                    const data = usnap.val();
                    const div = document.createElement('div');
                    div.className = "bg-white/5 border border-white/10 p-4 rounded-2xl flex justify-between items-center";
                    div.innerHTML = `
                        <div class="font-bold">${data.nickname}</div>
                        <button onclick="location.href='chat.html?room=${[user.uid, fuid].sort().join('_')}&peer=${fuid}'" class="text-indigo-400 font-bold text-xs uppercase">Chat</button>
                    `;
                    container.appendChild(div);
                });
            });
        });
    </script>
</body>
</html>
