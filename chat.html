<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Session | VIBE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #000; color: #fff; overflow: hidden; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .msg-me { background: #6366f1; color: white; border-radius: 20px 20px 0 20px; }
        .msg-them { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px 20px 20px 0; }
        .chat-container { height: calc(100vh - 180px); }
        /* Style for disabled state */
        .session-ended { opacity: 0.5; pointer-events: none; filter: grayscale(1); }
    </style>
</head>
<body class="flex flex-col items-center">

    <!-- SECURE HEADER -->
    <header class="w-full max-w-2xl h-24 border-b border-white/5 flex items-center justify-between px-6 bg-black/80 backdrop-blur-xl z-20">
        <div class="flex items-center gap-4">
            <button onclick="window.exitToHome()" class="text-slate-500 hover:text-white transition-colors"><i data-lucide="home" class="w-5 h-5"></i></button>
            <div class="w-11 h-11 bg-white/5 border border-white/10 rounded-2xl flex items-center justify-center font-bold" id="peer-initial">V</div>
            <div>
                <div class="flex items-center gap-2">
                    <span id="peer-name" class="font-bold text-sm tracking-tight italic uppercase">Stranger</span>
                    <span id="status-dot" class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span>
                </div>
                <div id="session-id" class="mono text-[8px] text-slate-500 uppercase tracking-widest mt-0.5">Session: Active</div>
            </div>
        </div>
        <div class="flex gap-2">
            <button id="add-friend-btn" class="hidden bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 px-3 py-2 rounded-xl text-[9px] font-black uppercase">+ Friend</button>
            <!-- NEW: DISCONNECT BUTTON -->
            <button onclick="window.skipSession()" class="bg-red-500/10 border border-red-500/20 text-red-500 px-4 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest hover:bg-red-500 hover:text-white transition-all">
                Skip
            </button>
        </div>
    </header>

    <!-- CHAT HUB -->
    <div id="chat-window" class="w-full max-w-2xl chat-container overflow-y-auto p-6 space-y-6 no-scrollbar">
        <div class="text-center py-10" id="start-msg">
            <div class="inline-block px-3 py-1 bg-white/5 border border-white/5 rounded-full text-[8px] font-black text-slate-500 uppercase tracking-[0.3em]">Frequency Established</div>
        </div>
    </div>

    <!-- PRO COMPOSER -->
    <div class="w-full max-w-2xl p-6 absolute bottom-0 bg-black" id="composer-area">
        <div class="flex gap-3 bg-white/5 border border-white/10 p-2 rounded-[1.8rem] shadow-inner">
            <input id="chat-input" type="text" placeholder="Send a message..." class="flex-1 bg-transparent px-5 py-3 outline-none text-sm font-medium text-white">
            <button id="send-btn" class="w-12 h-12 bg-white text-black rounded-full flex items-center justify-center hover:bg-indigo-600 hover:text-white transition-all">
                <i data-lucide="arrow-up" class="w-6 h-6"></i>
            </button>
        </div>
    </div>

    <script type="module">
        import { db, auth, ref, set, push, onChildAdded, onValue, get, remove, getMyUID, onAuthStateChanged, onDisconnect } from './config.js';

        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room');
        const peerId = params.get('peer');
        let myUID = null;
        let isActive = true;

        onAuthStateChanged(auth, async (user) => {
            myUID = user ? user.uid : getMyUID();
            
            if (roomId) {
                const roomRef = ref(db, `rooms/${roomId}`);
                
                // 1. Listen for messages
                onChildAdded(ref(db, `rooms/${roomId}/messages`), (snap) => {
                    addUI(snap.val().sender === myUID ? 'me' : 'stranger', snap.val().text);
                });

                // 2. Listen for Disconnect Status
                onValue(ref(db, `rooms/${roomId}/status`), (snap) => {
                    if (snap.val() === 'ended' && isActive) {
                        isActive = false;
                        handlePeerLeft();
                    }
                });

                // 3. Set Active Status on join
                set(ref(db, `rooms/${roomId}/status`), 'active');
                
                // 4. Auto-disconnect if tab is closed
                onDisconnect(ref(db, `rooms/${roomId}/status`)).set('ended');
            }

            // Peer Data Logic
            if (user && peerId && !peerId.startsWith('u')) {
                const peerSnap = await get(ref(db, `users/${peerId}`));
                if (peerSnap.exists()) {
                    document.getElementById('peer-name').innerText = peerSnap.val().nickname;
                    document.getElementById('peer-initial').innerText = peerSnap.val().nickname[0].toUpperCase();
                }
            }
        });

          // Skip Function: Kills room and goes back to matching
        window.skipSession = async () => {
    if (!roomId || !myUID) return;

    isActive = false;
    
    // 1. Signal to the peer that session is over
    await set(ref(db, `rooms/${roomId}/status`), 'ended');
    
    // 2. IMPORTANT: Wipe the match records in the lobby for BOTH users
    // This prevents the "Match Loop" bug
    await remove(ref(db, `lobby/${myUID}/match`));
    if (peerId) {
        await remove(ref(db, `lobby/${peerId}/match`));
    }

    // 3. Go to match.html with a "cache buster" to ensure a fresh search
    window.location.href = 'match.html?refresh=' + Date.now();
};


        window.exitToHome = () => {
            if (roomId) set(ref(db, `rooms/${roomId}/status`), 'ended');
            window.location.href = 'index.html';
        };

        function handlePeerLeft() {
            const box = document.getElementById('chat-window');
            const div = document.createElement('div');
            div.className = "text-center py-10 animate-pulse";
            div.innerHTML = `<div class="text-[10px] font-black text-red-500 uppercase tracking-[0.4em]">Stranger has left the session</div>
                             <button onclick="location.href='match.html'" class="mt-4 bg-white text-black px-6 py-2 rounded-xl text-[10px] font-bold uppercase">New Match</button>`;
            box.appendChild(div);
            
            // Disable UI
            document.getElementById('composer-area').classList.add('session-ended');
            document.getElementById('status-dot').classList.replace('bg-green-500', 'bg-red-500');
            document.getElementById('session-id').innerText = "Session: Ended";
        }

        const sendMsg = async () => {
            const input = document.getElementById('chat-input');
            if(!input.value.trim() || !roomId || !myUID || !isActive) return;
            await push(ref(db, `rooms/${roomId}/messages`), { sender: myUID, text: input.value.trim() });
            input.value = '';
        };

        document.getElementById('send-btn').onclick = sendMsg;
        document.getElementById('chat-input').onkeydown = (e) => { if(e.key === 'Enter') sendMsg(); };

        function addUI(sender, text) {
            const box = document.getElementById('chat-window');
            const div = document.createElement('div');
            div.className = `flex ${sender === 'me' ? 'justify-end' : 'justify-start'}`;
            div.innerHTML = `<div class="max-w-[80%] px-5 py-3.5 text-sm font-medium ${sender === 'me' ? 'msg-me' : 'msg-them'}">${text}</div>`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        lucide.createIcons();
    </script>
</body>
</html>
