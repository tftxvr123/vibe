<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Chat | VIBE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>body{background:#000; color:white; font-family:'Plus Jakarta Sans',sans-serif;} .msg-me{background:#6366f1; border-radius:1rem 1rem 0 1rem;} .msg-them{background:#1e293b; border-radius:1rem 1rem 1rem 0;}</style>
</head>
<body class="flex flex-col h-screen max-w-2xl mx-auto bg-black border-x border-white/10">

    <header class="p-4 border-b border-white/10 flex justify-between items-center bg-black/80 backdrop-blur-md">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center font-bold" id="p-init">V</div>
            <div class="font-bold text-sm" id="p-name">Stranger</div>
        </div>
        <button onclick="window.skip()" class="bg-red-500/10 border border-red-500/20 text-red-500 px-4 py-2 rounded-xl text-[10px] font-bold uppercase">Skip</button>
    </header>

    <div id="chat-box" class="flex-1 overflow-y-auto p-6 space-y-4"></div>

    <div class="p-4 border-t border-white/10 bg-black">
        <div class="flex gap-2 bg-white/5 p-1 rounded-2xl border border-white/10">
            <input id="m-input" type="text" placeholder="Type a message..." class="flex-1 bg-transparent px-4 py-3 outline-none text-sm text-white">
            <button id="send-btn" class="bg-indigo-600 text-white w-12 h-12 rounded-xl flex items-center justify-center"><i data-lucide="arrow-up"></i></button>
        </div>
    </div>

    <script type="module">
        import { db, auth, ref, set, push, onChildAdded, onValue, get, remove, getMyUID, onAuthStateChanged } from './config.js';

        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room');
        const peerId = params.get('peer');
        let myUID = null;

        onAuthStateChanged(auth, async (user) => {
            myUID = user ? user.uid : getMyUID();

            // NEW: Immediate Lobby Wipe to prevent "Re-matching" while already in chat
    if (myUID) {
        import { db, ref, remove } from './config.js'; // Ensure these are imported
        remove(ref(db, `lobby/${myUID}`));
    }
            

            if(roomId) {
                onChildAdded(ref(db, `rooms/${roomId}/messages`), (snap) => {
                    const msg = snap.val();
                    const box = document.getElementById('chat-box');
                    const div = document.createElement('div');
                    div.className = `flex ${msg.sender === myUID ? 'justify-end' : 'justify-start'}`;
                    div.innerHTML = `<div class="max-w-[80%] px-4 py-2 text-sm ${msg.sender === myUID ? 'msg-me' : 'msg-them'}">${msg.text}</div>`;
                    box.appendChild(div);
                    box.scrollTop = box.scrollHeight;
                });

                // Listen for skip
                onValue(ref(db, `rooms/${roomId}/status`), (snap) => {
                    if(snap.val() === 'ended') {
                        alert("Stranger has left.");
                        window.location.href = 'match.html';
                    }
                });
            }
        });

        window.skip = async () => {
            await set(ref(db, `rooms/${roomId}/status`), 'ended');
            window.location.href = 'match.html';
        };

        const send = () => {
            const val = document.getElementById('m-input').value.trim();
            if(!val || !roomId) return;
            push(ref(db, `rooms/${roomId}/messages`), { sender: myUID, text: val });
            document.getElementById('m-input').value = '';
        };

        document.getElementById('send-btn').onclick = send;
        document.getElementById('m-input').onkeydown = (e) => e.key === 'Enter' && send();
        lucide.createIcons();
    </script>
</body>
</html>
