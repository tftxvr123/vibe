<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Chat | VIBE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>body{background:#020617; color:white; font-family:'Plus Jakarta Sans',sans-serif;}</style>
</head>
<body class="flex flex-col h-screen max-w-2xl mx-auto border-x border-white/5 bg-[#020617]">
    
    <header class="p-4 border-b border-white/5 flex items-center justify-between glass sticky top-0 z-20 bg-[#020617]">
        <div class="flex items-center gap-3">
            <button onclick="location.href='index.html'" class="text-slate-400"><i data-lucide="home" class="w-5 h-5"></i></button>
            <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center font-bold uppercase" id="peer-initial">?</div>
            <div>
                <div id="peer-name" class="font-bold text-sm text-white italic">Stranger</div>
                <div id="status-label" class="text-[9px] text-green-500 font-bold uppercase tracking-widest animate-pulse">Live Connection</div>
            </div>
        </div>
        <div class="flex gap-2">
            <button id="add-friend-btn" class="hidden bg-indigo-600 text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest shadow-lg">
                + Add Friend
            </button>
            <button onclick="location.href='index.html'" class="bg-white text-black px-4 py-2 rounded-xl text-xs font-bold uppercase">Next</button>
        </div>
    </header>

    <div id="chat-window" class="flex-1 overflow-y-auto p-6 space-y-4 no-scrollbar pb-24"></div>

    <div class="p-4 bg-[#020617] border-t border-white/5 sticky bottom-0">
        <div class="flex gap-2 bg-white/5 p-1.5 rounded-2xl border border-white/10 shadow-inner">
            <input id="chat-input" type="text" placeholder="Type a message..." class="flex-1 bg-transparent px-4 py-3 outline-none text-sm text-white">
            <button id="send-btn" class="bg-indigo-600 text-white w-12 h-12 rounded-xl flex items-center justify-center shadow-lg">
                <i data-lucide="arrow-up" class="w-6 h-6"></i>
            </button>
        </div>
    </div>

    <script type="module">
        import { db, auth, ref, set, push, onChildAdded, get, getMyUID, onAuthStateChanged } from './config.js';

        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room');
        const peerId = params.get('peer');
        
        let myUID = null;

        onAuthStateChanged(auth, async (user) => {
            myUID = user ? user.uid : getMyUID();
            console.log("My ID:", myUID, "Peer ID:", peerId);

            if (roomId) {
                // Listen for messages
                onChildAdded(ref(db, `rooms/${roomId}/messages`), (snap) => {
                    const msg = snap.val();
                    addMessageUI(msg.sender === myUID ? 'me' : 'stranger', msg.text);
                });
            }

            // FRIEND LOGIC
            // Button only appears if I am logged in AND peer is logged in (peerId is not u...)
            if (user && peerId && !peerId.startsWith('u')) {
                const peerSnap = await get(ref(db, `users/${peerId}`));
                if (peerSnap.exists()) {
                    const peerData = peerSnap.val();
                    document.getElementById('peer-name').innerText = peerData.nickname;
                    document.getElementById('peer-initial').innerText = peerData.nickname[0];
                    
                    // Check if already friends
                    const friendSnap = await get(ref(db, `friends/${user.uid}/${peerId}`));
                    if (!friendSnap.exists()) {
                        const btn = document.getElementById('add-friend-btn');
                        btn.classList.remove('hidden');
                        btn.onclick = async () => {
                            await set(ref(db, `friends/${user.uid}/${peerId}`), true);
                            await set(ref(db, `friends/${peerId}/${user.uid}`), true);
                            btn.innerText = "ADDED";
                            btn.disabled = true;
                        };
                    }
                }
            }
        });

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text || !roomId || !myUID) {
                console.error("Missing data", {text, roomId, myUID});
                return;
            }
            await push(ref(db, `rooms/${roomId}/messages`), { 
                sender: myUID, 
                text: text,
                time: Date.now()
            });
            input.value = '';
        }

        document.getElementById('send-btn').onclick = sendMessage;
        document.getElementById('chat-input').onkeydown = (e) => { if(e.key === 'Enter') sendMessage(); };

        function addMessageUI(sender, text) {
            const box = document.getElementById('chat-window');
            const div = document.createElement('div');
            div.className = `flex ${sender === 'me' ? 'justify-end' : 'justify-start'} mb-2`;
            div.innerHTML = `<div class="max-w-[85%] px-4 py-2 rounded-2xl text-sm ${sender === 'me' ? 'bg-indigo-600 text-white rounded-tr-none' : 'bg-white/10 text-white rounded-tl-none'}">${text}</div>`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        lucide.createIcons();
    </script>
</body>
</html>
