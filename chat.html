<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Session | VIBE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #000; color: #fff; overflow: hidden; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Premium Bubbles */
        .msg-me { background: #6366f1; color: white; border-radius: 1.25rem 1.25rem 0 1.25rem; box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3); }
        .msg-them { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 1.25rem 1.25rem 1.25rem 0; }
        
        .chat-container { height: calc(100vh - 180px); }
        .disabled-input { opacity: 0.2; pointer-events: none; filter: grayscale(1); }
    </style>
</head>
<body class="flex flex-col items-center">

    <!-- HEADER -->
    <header class="w-full max-w-2xl h-20 border-b border-white/5 flex items-center justify-between px-6 bg-black/80 backdrop-blur-xl z-20">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='index.html'" class="text-slate-500 hover:text-white transition-colors">
                <i data-lucide="home" class="w-5 h-5"></i>
            </button>
            <div class="w-10 h-10 bg-white/5 border border-white/10 rounded-2xl flex items-center justify-center font-bold" id="peer-initial">V</div>
            <div>
                <div class="flex items-center gap-2">
                    <span id="peer-name" class="font-bold text-sm tracking-tight italic uppercase">Stranger</span>
                    <span id="status-dot" class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span>
                </div>
                <div class="mono text-[8px] text-slate-500 uppercase tracking-widest mt-0.5">Session: Secure</div>
            </div>
        </div>
        <div class="flex gap-2">
            <button id="add-friend-btn" class="hidden bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 px-3 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest">+ Friend</button>
            <button onclick="window.skipSession()" class="bg-white text-black px-4 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest hover:bg-indigo-600 hover:text-white transition-all">
                Skip
            </button>
        </div>
    </header>

    <!-- MESSAGES AREA -->
    <div id="chat-window" class="w-full max-w-2xl chat-container overflow-y-auto p-6 space-y-6 no-scrollbar pb-24">
        <div class="text-center py-10" id="start-msg">
            <div class="inline-block px-3 py-1 bg-white/5 border border-white/5 rounded-full text-[8px] font-black text-slate-500 uppercase tracking-[0.3em]">Frequency Synchronized</div>
        </div>
    </div>

    <!-- COMPOSER -->
    <div class="w-full max-w-2xl p-6 absolute bottom-0 bg-black" id="composer-area">
        <div id="typing-ui" class="mono text-[8px] text-indigo-400 mb-3 uppercase tracking-widest hidden animate-pulse">Stranger is typing...</div>
        <div class="flex gap-3 bg-white/5 border border-white/10 p-2 rounded-[1.8rem] shadow-inner focus-within:border-white/20 transition-all">
            <input id="chat-input" type="text" placeholder="Send a message..." class="flex-1 bg-transparent px-5 py-3 outline-none text-sm font-medium text-white">
            <button id="send-btn" class="w-12 h-12 bg-white text-black rounded-full flex items-center justify-center hover:bg-indigo-600 hover:text-white transition-all shadow-lg active:scale-90">
                <i data-lucide="arrow-up" class="w-6 h-6"></i>
            </button>
        </div>
    </div>

    <script type="module">
        import { db, auth, ref, set, push, onChildAdded, onValue, get, remove, getMyUID, onAuthStateChanged, off } from './config.js';

        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room');
        const peerId = params.get('peer');
        
        let myUID = null;
        let isActive = true;

        onAuthStateChanged(auth, async (user) => {
            myUID = user ? user.uid : getMyUID();

             // NEW: Clean up queue data as soon as we enter chat
    remove(ref(db, `searching/${myUID}`));
    remove(ref(db, `matches/${myUID}`));
            
            if (roomId) {
                // 1. Listen for messages
                onChildAdded(ref(db, `rooms/${roomId}/messages`), (snap) => {
                    const msg = snap.val();
                    addUI(msg.sender === myUID ? 'me' : 'stranger', msg.text);
                });

                // 2. Listen for Session End (If stranger skips)
                onValue(ref(db, `rooms/${roomId}/status`), (snap) => {
                    if (snap.val() === 'ended' && isActive) {
                        isActive = false;
                        handleDisconnect();
                    }
                });
            }

            // Peer Data & Friend Logic
            if (user && peerId && !peerId.startsWith('u')) {
                const peerSnap = await get(ref(db, `users/${peerId}`));
                if (peerSnap.exists()) {
                    document.getElementById('peer-name').innerText = peerSnap.val().nickname;
                    document.getElementById('peer-initial').innerText = peerSnap.val().nickname[0].toUpperCase();
                }
                
                const friendSnap = await get(ref(db, `friends/${user.uid}/${peerId}`));
                if (!friendSnap.exists()) {
                    const btn = document.getElementById('add-friend-btn');
                    btn.classList.remove('hidden');
                    btn.onclick = async () => {
                        await set(ref(db, `friends/${user.uid}/${peerId}`), true);
                        await set(ref(db, `friends/${peerId}/${user.uid}`), true);
                        btn.innerText = "ADDED";
                        btn.disabled = true;
                    };
                }
            }
        });

        // FULL SKIP LOGIC
        window.skipSession = async () => {
            if (!roomId || !myUID) return;
            isActive = false;

            // 1. Tell stranger the session is over
            await set(ref(db, `rooms/${roomId}/status`), 'ended');

            // 2. Wipe matching records from lobby for BOTH users
            await remove(ref(db, `lobby/${myUID}`));
            if (peerId) {
                await remove(ref(db, `lobby/${peerId}/match`));
            }

            // 3. Redirect back to Radar
            window.location.href = 'match.html';
        };

        function handleDisconnect() {
            const box = document.getElementById('chat-window');
            const div = document.createElement('div');
            div.className = "text-center py-10";
            div.innerHTML = `
                <div class="text-[10px] font-black text-red-500 uppercase tracking-[0.4em] mb-4">Stranger has left</div>
                <button onclick="window.location.href='match.html'" class="bg-white text-black px-6 py-2 rounded-xl text-[10px] font-black uppercase">Find New Vibe</button>
            `;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;

            document.getElementById('composer-area').classList.add('disabled-input');
            document.getElementById('status-dot').classList.replace('bg-green-500', 'bg-red-500');
            document.getElementById('status-dot').classList.remove('animate-pulse');
        }

        async function sendMsg() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if(!text || !roomId || !myUID || !isActive) return;

            await push(ref(db, `rooms/${roomId}/messages`), {
                sender: myUID,
                text: text,
                time: Date.now()
            });
            input.value = '';
        }

        document.getElementById('send-btn').onclick = sendMsg;
        document.getElementById('chat-input').onkeydown = (e) => e.key === 'Enter' && sendMsg();

        function addUI(sender, text) {
            const box = document.getElementById('chat-window');
            const div = document.createElement('div');
            div.className = `flex ${sender === 'me' ? 'justify-end' : 'justify-start'} mb-1`;
            div.innerHTML = `<div class="max-w-[80%] px-5 py-3 text-sm font-medium ${sender === 'me' ? 'msg-me' : 'msg-them'}">${text}</div>`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        lucide.createIcons();
    </script>
</body>
</html>
