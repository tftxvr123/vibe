<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat | VIBE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans'; background: #000; color: white; overflow: hidden; }
        .msg-me { background: #6366f1; border-radius: 1rem 1rem 0 1rem; margin-left: auto; }
        .msg-them { background: #1e293b; border-radius: 1rem 1rem 1rem 0; }
        .chat-area { height: calc(100vh - 160px); }
    </style>
</head>
<body class="flex flex-col items-center">

    <header class="w-full max-w-2xl h-20 border-b border-white/5 flex items-center justify-between px-6 bg-black">
        <div class="flex items-center gap-3">
            <button id="btn-home" class="text-slate-500 hover:text-white"><i data-lucide="home" class="w-5 h-5"></i></button>
            <div class="font-bold text-sm italic uppercase tracking-tight">Session Live</div>
        </div>
        <button id="btn-skip" class="bg-red-500/10 border border-red-500/20 text-red-500 px-5 py-2 rounded-xl text-[10px] font-black uppercase">
            Skip
        </button>
    </header>

    <div id="chat-window" class="w-full max-w-2xl chat-area overflow-y-auto p-6 space-y-4 no-scrollbar"></div>

    <div class="w-full max-w-2xl p-4 bg-black border-t border-white/5">
        <div class="flex gap-2 bg-white/5 p-1 rounded-2xl border border-white/10">
            <input id="chat-input" type="text" placeholder="Say something..." class="flex-1 bg-transparent px-4 py-3 outline-none text-sm text-white">
            <button id="btn-send" class="bg-indigo-600 text-white w-12 h-12 rounded-xl flex items-center justify-center shadow-lg">
                <i data-lucide="arrow-up" class="w-6 h-6"></i>
            </button>
        </div>
    </div>

    <script type="module">
        import { db, auth, ref, set, push, onChildAdded, onValue, remove, getMyUID, onAuthStateChanged } from './config.js';

        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room');
        const peerId = params.get('peer');
        let myUID = null;

        // --- BUTTON BINDING ---
        document.getElementById('btn-home').onclick = () => window.location.href = 'index.html';
        document.getElementById('btn-skip').onclick = () => {
            if (roomId) set(ref(db, `rooms/${roomId}/status`), 'ended');
            window.location.href = 'match.html';
        };

        onAuthStateChanged(auth, async (user) => {
            myUID = user ? user.uid : getMyUID();
            
            // CLEANUP lobby so you don't match again while chatting
            remove(ref(db, `lobby/${myUID}`));

            if (roomId) {
                // 1. Listen for messages
                onChildAdded(ref(db, `rooms/${roomId}/messages`), (snap) => {
                    const msg = snap.val();
                    const box = document.getElementById('chat-window');
                    const div = document.createElement('div');
                    div.className = `max-w-[80%] px-4 py-3 text-sm font-medium ${msg.sender === myUID ? 'msg-me' : 'msg-them'}`;
                    div.innerText = msg.text;
                    box.appendChild(div);
                    box.scrollTop = box.scrollHeight;
                });

                // 2. Listen for Skip from stranger
                onValue(ref(db, `rooms/${roomId}/status`), (snap) => {
                    if (snap.val() === 'ended') {
                        alert("Stranger left.");
                        window.location.href = 'match.html';
                    }
                });
            }
        });

        // --- SEND LOGIC ---
        const send = async () => {
            const input = document.getElementById('chat-input');
            if (!input.value.trim() || !roomId) return;
            await push(ref(db, `rooms/${roomId}/messages`), { sender: myUID, text: input.value.trim() });
            input.value = '';
        };

        document.getElementById('btn-send').onclick = send;
        document.getElementById('chat-input').onkeydown = (e) => e.key === 'Enter' && send();

        lucide.createIcons();
    </script>
</body>
</html>
