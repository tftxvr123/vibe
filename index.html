<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIBE DEEP | 18+ Community</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #000; color: #fff; overflow-x: hidden; }
        .screen { display: none; min-height: 100vh; flex-direction: column; position: relative; z-index: 10; padding-bottom: 80px; }
        .screen.active { display: flex; }
        .pro-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: radial-gradient(circle at 50% -20%, #1e1b4b 0%, #000 85%); }
        .noise { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; opacity: 0.05; pointer-events: none; background-image: url('https://grainy-gradients.vercel.app/noise.svg'); }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 1.5rem; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .fab { position: fixed; bottom: 24px; right: 24px; z-index: 100; width: 64px; height: 64px; background: #6366f1; border-radius: 20px; display: flex; items-center; justify-center; box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4); }
        .story-badge { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
    </style>
</head>
<body>

    <div class="pro-bg"></div>
    <div class="noise"></div>

    <!-- PERSISTENT NAV -->
    <nav class="fixed top-0 w-full z-50 h-16 border-b border-white/5 bg-black/50 backdrop-blur-md flex items-center justify-between px-6">
        <div class="flex items-center gap-2 cursor-pointer" onclick="showScreen('landing')">
            <div class="w-7 h-7 bg-indigo-600 rounded flex items-center justify-center text-white"><i data-lucide="zap" class="w-4 h-4 fill-current"></i></div>
            <span class="text-lg font-bold tracking-tighter uppercase italic">VIBE<span class="text-indigo-500">DEEP</span></span>
        </div>
        <div class="flex items-center gap-6">
            <button onclick="showScreen('discover')" class="text-slate-400 hover:text-white"><i data-lucide="compass" class="w-5 h-5"></i></button>
            <button onclick="showScreen('rooms')" class="text-slate-400 hover:text-white"><i data-lucide="layers" class="w-5 h-5"></i></button>
            <button onclick="showScreen('profile')" class="w-8 h-8 rounded-full border border-indigo-500/50 overflow-hidden"><img id="my-avatar-nav" src=""></button>
        </div>
    </nav>

    <!-- FLOATING CREATE BUTTON -->
    <button onclick="toggleCreateMenu()" class="fab"><i data-lucide="plus" class="text-white w-8 h-8"></i></button>
    <div id="create-menu" class="fixed inset-0 z-[110] bg-black/90 backdrop-blur-md hidden flex-col items-center justify-center p-6">
        <h2 class="text-3xl font-black italic uppercase mb-12">Share your vibe</h2>
        <div class="grid grid-cols-2 gap-4 w-full max-w-sm">
            <button onclick="openEditor('story')" class="glass-card p-6 flex flex-col items-center"><i data-lucide="book-open" class="mb-2 text-indigo-400"></i><span class="text-[10px] font-bold uppercase">Story</span></button>
            <button onclick="openEditor('confession')" class="glass-card p-6 flex flex-col items-center"><i data-lucide="ghost" class="mb-2 text-purple-400"></i><span class="text-[10px] font-bold uppercase">Confession</span></button>
        </div>
        <button onclick="toggleCreateMenu()" class="mt-20 text-slate-500 uppercase text-xs font-bold tracking-widest">Close</button>
    </div>

    <!-- SCREEN 1: LANDING (The Dashboard) -->
    <section id="landing" class="screen active pt-24 px-6">
        <!-- FEATURE 7: DAILY VIBE (Poll) -->
        <div class="glass-card p-6 mb-8 border-indigo-500/20">
            <h3 class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest mb-4">Today's Vibe</h3>
            <p class="text-lg font-bold italic mb-6">"Is a first date at a dhaba better than a fancy cafe?"</p>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="voteDaily('dhaba')" class="bg-white/5 p-3 rounded-xl text-xs font-bold uppercase hover:bg-indigo-600 transition-all">🏠 Dhaba</button>
                <button onclick="voteDaily('cafe')" class="bg-white/5 p-3 rounded-xl text-xs font-bold uppercase hover:bg-indigo-600 transition-all">☕ Cafe</button>
            </div>
        </div>

        <h2 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-6">Trending Stories</h2>
        <div id="landing-stories" class="space-y-4">
            <!-- Dynamic Stories -->
        </div>

        <button onclick="showScreen('stories')" class="w-full mt-6 text-indigo-400 font-bold text-xs uppercase tracking-widest">See all stories →</button>
    </section>

    <!-- SCREEN 2: STORIES FEED -->
    <section id="stories" class="screen pt-24 px-6">
        <h2 class="text-3xl font-black italic uppercase mb-8">Vibe <span class="text-indigo-500">Stories</span></h2>
        <div id="full-stories-feed" class="space-y-6">
            <!-- Dynamic Stories -->
        </div>
    </section>

    <!-- SCREEN 3: CONFESSIONS FEED -->
    <section id="confessions" class="screen pt-24 px-6">
        <h2 class="text-3xl font-black italic uppercase mb-2">Anonymous</h2>
        <p class="text-slate-500 font-bold uppercase text-[10px] tracking-widest mb-8">Confessions</p>
        <div id="confessions-feed" class="grid grid-cols-1 gap-4">
            <!-- Dynamic Confessions -->
        </div>
    </section>

    <!-- SCREEN 4: ROOMS -->
    <section id="rooms" class="screen pt-24 px-6">
        <h2 class="text-3xl font-black italic uppercase mb-8">Vibe <span class="text-indigo-500">Rooms</span></h2>
        <div class="grid grid-cols-2 gap-4">
            <button onclick="joinRoom('Married & Curious')" class="glass-card p-8 text-left">
                <div class="text-indigo-400 mb-2"><i data-lucide="heart"></i></div>
                <h3 class="font-bold text-sm italic uppercase">Married & Curious</h3>
                <p class="text-[9px] text-slate-500 mt-2 uppercase font-black">2.1k Vibing</p>
            </button>
            <button onclick="joinRoom('Couples')" class="glass-card p-8 text-left">
                <div class="text-purple-400 mb-2"><i data-lucide="users"></i></div>
                <h3 class="font-bold text-sm italic uppercase">Couples Circle</h3>
                <p class="text-[9px] text-slate-500 mt-2 uppercase font-black">840 Vibing</p>
            </button>
        </div>
    </section>

    <!-- EDITOR MODAL -->
    <div id="editor-modal" class="fixed inset-0 z-[120] bg-black hidden flex-col p-6">
        <div class="flex justify-between items-center mb-8">
            <h3 id="editor-title" class="text-xl font-black uppercase italic">Create Post</h3>
            <button onclick="closeEditor()" class="text-slate-500"><i data-lucide="x"></i></button>
        </div>
        <input id="post-title" type="text" placeholder="Title (for stories only)" class="bg-white/5 border border-white/10 p-4 rounded-xl mb-4 outline-none font-bold text-white">
        <textarea id="post-content" placeholder="What's on your mind?" class="flex-1 bg-white/5 border border-white/10 p-4 rounded-xl mb-6 outline-none text-white leading-relaxed"></textarea>
        <button onclick="publishPost()" class="bg-indigo-600 py-5 rounded-2xl font-black uppercase tracking-widest text-lg">Publish to Vibe</button>
    </div>

    <!-- (PRESERVED) CHAT / DISCOVERY ENGINE -->
    <!-- (The engine from Phase 2 remains in the JS below) -->

    <script>
        // --- DATABASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyDjve9Lpih3Tl4mNGn1gxdZ6RQqONs7Bo4",
            authDomain: "vibe-78d6f.firebaseapp.com",
            databaseURL: "https://vibe-78d6f-default-rtdb.firebaseio.com",
            projectId: "vibe-78d6f",
            storageBucket: "vibe-78d6f.firebasestorage.app",
            messagingSenderId: "676783066321",
            appId: "1:676783066321:web:4b9535e39559df464b09f0"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        // --- APP STATE ---
        let myId = null;
        let activeType = null; // 'story' or 'confession'

        // --- NAVIGATION CONTROLLER ---
        window.showScreen = (id) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'landing' || id === 'stories') loadStories();
            if(id === 'confessions') loadConfessions();
            lucide.createIcons();
        };

        // --- PHASE 3: STORIES ENGINE ---
        function loadStories() {
            db.ref('stories').limitToLast(10).on('value', snap => {
                const stories = snap.val();
                const container = document.getElementById('landing-stories');
                const fullFeed = document.getElementById('full-stories-feed');
                container.innerHTML = '';
                fullFeed.innerHTML = '';

                for(let id in stories) {
                    const s = stories[id];
                    const card = `
                        <div class="glass-card p-6">
                            <div class="flex items-center gap-2 mb-4">
                                <span class="text-[8px] font-black uppercase tracking-widest px-2 py-1 story-badge rounded text-white">${s.category || 'Experience'}</span>
                                <span class="text-[8px] text-slate-500 font-bold uppercase">${new Date(s.time).toLocaleDateString()}</span>
                            </div>
                            <h4 class="text-xl font-bold italic mb-2 tracking-tight uppercase">${s.title}</h4>
                            <p class="text-slate-400 text-sm leading-relaxed line-clamp-3">${s.content}</p>
                            <div class="mt-6 flex justify-between items-center border-t border-white/5 pt-4">
                                <span class="text-[10px] font-black uppercase text-indigo-400 italic">By ${s.author}</span>
                                <div class="flex gap-4 text-slate-500">
                                    <span class="flex items-center gap-1 text-[10px] font-bold"><i data-lucide="heart" class="w-3 h-3"></i> ${s.likes || 0}</span>
                                    <span class="flex items-center gap-1 text-[10px] font-bold"><i data-lucide="message-circle" class="w-3 h-3"></i> ${s.comments || 0}</span>
                                </div>
                            </div>
                        </div>`;
                    container.insertAdjacentHTML('afterbegin', card);
                    fullFeed.insertAdjacentHTML('afterbegin', card);
                }
                lucide.createIcons();
            });
        }

        // --- PHASE 3: CONFESSIONS ENGINE ---
        function loadConfessions() {
            db.ref('confessions').limitToLast(20).on('value', snap => {
                const confs = snap.val();
                const feed = document.getElementById('confessions-feed');
                feed.innerHTML = '';
                for(let id in confs) {
                    const c = confs[id];
                    feed.insertAdjacentHTML('afterbegin', `
                        <div class="glass-card p-6 border-purple-500/20">
                            <p class="text-slate-200 text-sm leading-relaxed italic">"${c.content}"</p>
                            <div class="mt-4 flex justify-between items-center opacity-50">
                                <span class="text-[8px] font-black uppercase tracking-[0.2em]">Anonymous Confession</span>
                                <i data-lucide="ghost" class="w-3 h-3"></i>
                            </div>
                        </div>
                    `);
                }
                lucide.createIcons();
            });
        }

        // --- EDITOR LOGIC ---
        window.toggleCreateMenu = () => document.getElementById('create-menu').classList.toggle('hidden');
        window.openEditor = (type) => {
            activeType = type;
            document.getElementById('editor-modal').classList.remove('hidden');
            document.getElementById('post-title').style.display = (type === 'story') ? 'block' : 'none';
            document.getElementById('editor-title').innerText = `Write ${type}`;
            toggleCreateMenu();
        };
        window.closeEditor = () => document.getElementById('editor-modal').classList.add('hidden');

        window.publishPost = () => {
            const title = document.getElementById('post-title').value;
            const content = document.getElementById('post-content').value;
            if(!content) return alert("Content required");

            const path = activeType === 'story' ? 'stories' : 'confessions';
            const data = {
                title: title || 'Untitled',
                content,
                author: 'Member',
                time: firebase.database.ServerValue.TIMESTAMP,
                likes: 0
            };

            db.ref(path).push(data);
            closeEditor();
            showScreen(path);
        };

        // --- INITIALIZATION ---
        auth.onAuthStateChanged(user => {
            if (user) {
                myId = user.uid;
                document.getElementById('my-avatar-nav').src = `https://api.dicebear.com/7.x/avataaars/svg?seed=${myId}`;
                showScreen('landing');
            } else {
                auth.signInAnonymously();
            }
        });

        lucide.createIcons();
    </script>
</body>
</html>
