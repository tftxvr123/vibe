<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIBE | Wavelength Matching</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        :root {
            --accent: #6366f1;
            --bg: #020617;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg); 
            color: #ffffff; 
            overflow-x: hidden; 
            -webkit-tap-highlight-color: transparent;
        }

        .screen { display: none; min-height: 100vh; flex-direction: column; }
        .screen.active { display: flex; }

        /* Premium Glassmorphism */
        .glass-nav { background: rgba(2, 6, 23, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-card { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 1.5rem;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.05);
        }
        
        /* Fixed Button Logic */
        .pref-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }
        .pref-btn.active {
            background: var(--accent);
            border-color: #818cf8;
            color: white;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
        }

        .cta-main {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        @keyframes pulse-slow { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.6; } }
        .bg-glow { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #020617 70%); }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <!-- NAVBAR -->
    <nav id="nav" class="fixed top-0 w-full z-50 glass-nav h-16 flex items-center justify-between px-6">
        <div class="flex items-center gap-2 cursor-pointer" onclick="location.reload()">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white shadow-lg">
                <i data-lucide="zap" class="w-4 h-4 fill-current"></i>
            </div>
            <span class="text-lg font-extrabold tracking-tighter uppercase italic">VIBE</span>
        </div>
        <div class="flex items-center gap-2 bg-white/5 px-3 py-1 rounded-full border border-white/10">
            <span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span>
            <span id="user-count" class="text-[9px] font-bold uppercase tracking-widest text-slate-400">2,410 Live</span>
        </div>
    </nav>

    <!-- 1. LANDING -->
    <section id="landing" class="screen active pt-40 px-6 items-center text-center">
        <div class="max-w-2xl">
            <h1 class="text-5xl md:text-6xl font-extrabold mb-6 tracking-tighter leading-tight">
                Meet on your <br/><span class="text-indigo-400 italic">wavelength.</span>
            </h1>
            <p class="text-base text-slate-400 mb-10 max-w-sm mx-auto leading-relaxed">
                India's interest-based anonymous chat. <br/>Match on vibes, not just random clicks.
            </p>
            <button onclick="window.showScreen('interests')" class="cta-main text-white px-10 py-4 rounded-2xl font-bold text-lg transition-transform active:scale-95">
                Start Vibing
            </button>
            <div class="mt-12 flex justify-center gap-8 opacity-40 grayscale">
                <i data-lucide="shield-check" class="w-5 h-5"></i>
                <i data-lucide="user-check" class="w-5 h-5"></i>
                <i data-lucide="lock" class="w-5 h-5"></i>
            </div>
        </div>
    </section>

    <!-- 2. INTERESTS -->
    <section id="interests" class="screen pt-28 px-6 items-center">
        <div class="max-w-md w-full">
            <h2 class="text-3xl font-bold mb-2 tracking-tight">Interests</h2>
            <p class="text-slate-400 mb-8 text-sm">Add at least 1 topic you want to talk about.</p>
            
            <div class="glass-card p-5 focus-within:border-indigo-500/50 transition-all">
                <div id="tag-container" class="flex flex-wrap gap-2 mb-4"></div>
                <input id="tag-input" type="text" placeholder="Type (F1, Cricket, AI)..." class="w-full bg-transparent outline-none text-lg font-medium py-1 text-white">
            </div>

            <div class="fixed bottom-10 left-0 w-full px-6 flex justify-center">
                <button id="next-to-prefs" disabled onclick="window.showScreen('preferences')" class="max-w-md w-full cta-main text-white py-4 rounded-2xl font-bold text-lg disabled:opacity-20 transition-all">Continue</button>
            </div>
        </div>
    </section>

    <!-- 3. PREFERENCES (FIXED) -->
    <section id="preferences" class="screen pt-28 px-6 items-center overflow-y-auto pb-24">
        <div class="max-w-md w-full">
            <h2 class="text-3xl font-bold mb-8 tracking-tight">Fine-tune</h2>
            
            <div class="space-y-6">
                <!-- MARITAL -->
                <div class="glass-card p-6">
                    <label class="text-[10px] font-bold text-slate-500 uppercase block mb-4 tracking-widest">Marital Status</label>
                    <div class="grid grid-cols-1 gap-2 mb-2">
                        <button onclick="window.setPref('marital', 'Anyone', this)" class="pref-btn active p-3 rounded-xl font-bold text-xs">Anyone</button>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="window.setPref('marital', 'Single', this)" class="pref-btn p-3 rounded-xl font-bold text-xs">Single</button>
                        <button onclick="window.setPref('marital', 'Married', this)" class="pref-btn p-3 rounded-xl font-bold text-xs">Married</button>
                        <button onclick="window.setPref('marital', 'Divorced', this)" class="pref-btn p-3 rounded-xl font-bold text-xs">Divorced</button>
                    </div>
                </div>

                <!-- STYLE -->
                <div class="glass-card p-6">
                    <label class="text-[10px] font-bold text-slate-500 uppercase block mb-4 tracking-widest">Chat Style</label>
                    <div class="grid grid-cols-1 gap-2 mb-2">
                        <button onclick="window.setPref('style', 'Anything', this)" class="pref-btn active p-3 rounded-xl font-bold text-xs">Anything</button>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="window.setPref('style', 'Deep Talk', this)" class="pref-btn p-3 rounded-xl font-bold text-xs">Deep Talk</button>
                        <button onclick="window.setPref('style', 'Deep Naughty', this)" class="pref-btn p-3 rounded-xl font-bold text-xs">Deep Naughty</button>
                    </div>
                </div>
            </div>

            <button onclick="window.startMatching()" class="w-full mt-10 cta-main text-white py-4 rounded-2xl font-bold text-lg">Find My Vibe</button>
        </div>
    </section>

    <!-- 4. MATCHING -->
    <section id="matching" class="screen items-center justify-center text-center p-6 bg-[#020617]">
        <div class="w-20 h-20 bg-indigo-600 rounded-[2rem] flex items-center justify-center mb-8 shadow-2xl animate-pulse">
            <i data-lucide="compass" class="w-10 h-10 text-white animate-spin [animation-duration:3s]"></i>
        </div>
        <h2 class="text-2xl font-bold mb-2">Scanning wavelength...</h2>
        <p class="text-indigo-400 text-[10px] font-bold uppercase tracking-[0.4em]">Matching in India</p>
    </section>

    <!-- 5. CHAT -->
    <section id="chat" class="screen bg-[#020617]">
        <div class="flex flex-col h-screen max-w-2xl mx-auto border-x border-white/5 relative bg-[#020617]">
            <header class="p-4 border-b border-white/5 flex items-center justify-between glass-nav sticky top-0 z-20">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold">V</div>
                    <div>
                        <div class="font-bold text-sm text-white flex items-center gap-2">Stranger <span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span></div>
                        <div id="mode-label" class="text-[9px] text-indigo-400 font-bold uppercase tracking-widest">Active</div>
                    </div>
                </div>
                <button onclick="window.disconnectAndNext()" class="bg-white text-black px-5 py-2 rounded-xl text-xs font-bold transition-all">Next</button>
            </header>

            <div id="chat-window" class="flex-1 overflow-y-auto p-6 space-y-4 no-scrollbar"></div>

            <div class="p-4 bg-[#020617] border-t border-white/5 sticky bottom-0">
                <div id="typing-ui" class="text-[9px] font-bold text-indigo-400 mb-2 uppercase hidden tracking-widest animate-pulse">Typing...</div>
                <div class="flex gap-2 bg-white/5 p-1.5 rounded-2xl border border-white/10">
                    <input id="chat-input" type="text" placeholder="Start typing..." class="flex-1 bg-transparent px-4 py-3 outline-none text-sm text-white">
                    <button onclick="window.sendMessage()" class="bg-indigo-600 text-white w-12 h-12 rounded-xl flex items-center justify-center shadow-lg active:scale-90 transition-all">
                        <i data-lucide="arrow-up" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- SCRIPTS -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, onChildAdded, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // CONFIG (Your actual working keys)
        const firebaseConfig = {
            apiKey: "AIzaSyDjve9Lpih3Tl4mNGn1gxdZ6RQqONs7Bo4",
            authDomain: "vibe-78d6f.firebaseapp.com",
            databaseURL: "https://vibe-78d6f-default-rtdb.firebaseio.com",
            projectId: "vibe-78d6f",
            storageBucket: "vibe-78d6f.firebasestorage.app",
            messagingSenderId: "676783066321",
            appId: "1:676783066321:web:4b9535e39559df464b09f0",
            measurementId: "G-Z7TFPM7SRT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const myId = 'u' + Math.random().toString(36).substr(2, 7);
        
        let interests = [];
        let currentRoom = null;
        let prefs = { style: 'Anything', marital: 'Anyone' };

        window.showScreen = (id) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('nav').style.display = (id === 'landing' || id === 'interests') ? 'flex' : 'none';
            window.scrollTo(0,0);
            lucide.createIcons();
        };

        // Interests
        window.addTag = (text) => {
            const val = text.toLowerCase().trim();
            if (!interests.includes(val)) {
                interests.push(val);
                renderTags();
            }
        };

        window.removeTag = (text) => {
            interests = interests.filter(t => t !== text);
            renderTags();
        };

        function renderTags() {
            const container = document.getElementById('tag-container');
            container.innerHTML = interests.map(t => `<div class="flex items-center gap-1.5 bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-[10px] font-bold">${t} <button onclick="window.removeTag('${t}')"><i data-lucide="x" class="w-3 h-3"></i></button></div>`).join('');
            document.getElementById('next-to-prefs').disabled = interests.length < 1; 
            lucide.createIcons();
        }

        // Prefs Logic (Fixed selector)
        window.setPref = (type, val, btn) => {
            prefs[type] = val;
            const parent = btn.closest('.glass-card');
            parent.querySelectorAll('.pref-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        };

        // Matching
        window.startMatching = () => {
            window.showScreen('matching');
            const lobbyRef = ref(db, 'lobby/' + myId);
            set(lobbyRef, { id: myId, interests, prefs, time: Date.now() });

            onValue(ref(db, 'lobby'), (snap) => {
                const users = snap.val();
                if (!users || currentRoom) return;
                Object.keys(users).forEach(peerId => {
                    if (peerId === myId || currentRoom) return;
                    const peer = users[peerId];
                    const common = peer.interests.filter(i => interests.includes(i));
                    
                    if (common.length > 0) {
                        const roomId = [myId, peerId].sort().join('_');
                        currentRoom = roomId;
                        set(ref(db, 'lobby/' + peerId + '/match'), { roomId, style: prefs.style });
                        set(ref(db, 'lobby/' + myId + '/match'), { roomId, style: prefs.style });
                        startChat(roomId, prefs.style);
                    }
                });
            });

            onValue(ref(db, 'lobby/' + myId + '/match'), (snap) => {
                const data = snap.val();
                if (data && !currentRoom) {
                    currentRoom = data.roomId;
                    startChat(data.roomId, data.style);
                }
            });
        };

        function startChat(roomId, style) {
            window.showScreen('chat');
            document.getElementById('mode-label').innerText = style + " Mode";
            remove(ref(db, 'lobby/' + myId));

            const statusRef = ref(db, 'rooms/' + roomId + '/status');
            set(statusRef, 'active');
            onDisconnect(statusRef).set('disconnected');

            onValue(statusRef, (snap) => {
                if (snap.val() === 'disconnected') {
                    addSystemMessage("Stranger has left.");
                }
            });

            onChildAdded(ref(db, 'rooms/' + roomId + '/messages'), (snap) => {
                const msg = snap.val();
                addMessageUI(msg.sender === myId ? 'me' : 'stranger', msg.text);
            });
        }

        window.disconnectAndNext = () => {
            if (currentRoom) set(ref(db, 'rooms/' + currentRoom + '/status'), 'disconnected');
            location.reload();
        };

        window.sendMessage = () => {
            const input = document.getElementById('chat-input');
            if (!input.value.trim() || !currentRoom) return;
            push(ref(db, 'rooms/' + currentRoom + '/messages'), { sender: myId, text: input.value.trim(), time: Date.now() });
            input.value = '';
        };

        function addMessageUI(sender, text) {
            const box = document.getElementById('chat-window');
            const div = document.createElement('div');
            div.className = `flex ${sender === 'me' ? 'justify-end' : 'justify-start'} mb-3`;
            div.innerHTML = `<div class="max-w-[85%] px-4 py-3 rounded-2xl text-sm font-medium ${sender === 'me' ? 'bg-indigo-600 text-white rounded-tr-none' : 'bg-white/5 border border-white/10 text-slate-200 rounded-tl-none'}">${text}</div>`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function addSystemMessage(text) {
            const box = document.getElementById('chat-window');
            const div = document.createElement('div');
            div.className = "text-center py-6 text-[10px] font-bold text-red-400 uppercase tracking-widest";
            div.innerText = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        document.getElementById('tag-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.target.value.trim() !== '') {
                window.addTag(e.target.value);
                e.target.value = '';
            }
        });

        document.getElementById('chat-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') window.sendMessage();
        });

        setInterval(() => {
            const count = 2410 + Math.floor(Math.random() * 20);
            document.getElementById('user-count').innerText = count + " Live";
        }, 3000);

        lucide.createIcons();
    </script>
</body>
</html>
