<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIBE | Wavelength Matching</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        :root { --accent: #6366f1; --bg: #030712; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: #fff; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .screen { display: none; min-height: 100vh; flex-direction: column; position: relative; z-index: 10; }
        .screen.active { display: flex; }
        .mesh-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.12) 0px, transparent 50%), radial-gradient(at 100% 0%, rgba(168, 85, 247, 0.08) 0px, transparent 50%), radial-gradient(at 50% 100%, rgba(79, 70, 229, 0.05) 0px, transparent 50%); background-color: #020617; }
        .noise { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; opacity: 0.03; pointer-events: none; background-image: url('https://grainy-gradients.vercel.app/noise.svg'); }
        .glass-card { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 1.5rem; box-shadow: inset 0 1px 1px rgba(255,255,255,0.05); }
        .pref-btn { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); transition: 0.3s; border-radius: 1rem; font-weight: 700; font-size: 10px; text-transform: uppercase; color: #94a3b8; }
        .pref-btn.active { background: #6366f1; border-color: #818cf8; color: white; box-shadow: 0 10px 30px -10px rgba(99, 102, 241, 0.6); }
        .msg-me { background: #6366f1; border-radius: 1.25rem 1.25rem 0 1.25rem; align-self: flex-end; box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3); }
        .msg-them { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 1.25rem 1.25rem 1.25rem 0; align-self: flex-start; }
        @keyframes scan { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .radar-spin { animation: scan 4s linear infinite; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div class="mesh-bg"></div>
    <div class="noise"></div>

    <!-- PERSISTENT NAV -->
    <nav id="top-nav" class="fixed top-0 w-full z-50 h-16 border-b border-white/5 bg-black/60 backdrop-blur-xl flex items-center justify-between px-4 md:px-12">
        <div class="flex items-center gap-2 cursor-pointer" onclick="location.reload()">
            <div class="w-7 h-7 bg-indigo-600 rounded flex items-center justify-center text-white shadow-lg"><i data-lucide="zap" class="w-4 h-4 fill-current"></i></div>
            <span class="text-xl font-black tracking-tighter uppercase italic text-white">VIBE</span>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="showScreen('rooms')" class="text-[10px] font-black uppercase tracking-widest text-slate-400 hover:text-indigo-400 transition-colors">Rooms</button>
            <div id="nav-auth-area" class="flex items-center"></div>
        </div>
    </nav>

    <!-- 1. LANDING -->
    <section id="landing" class="screen active pt-40 px-6 items-center text-center">
        <div class="max-w-4xl">
            <h1 class="text-5xl md:text-7xl font-black tracking-tighter leading-[0.95] mb-8 uppercase italic text-white">Meet on your <br/><span class="text-indigo-500">wavelength.</span></h1>
            <button onclick="showScreen('interests')" class="bg-white text-black px-12 py-5 rounded-2xl font-black text-lg uppercase tracking-tighter hover:bg-indigo-600 hover:text-white transition-all shadow-2xl active:scale-95">Start Vibing</button>
            
            <div class="mt-32 w-full text-left max-w-2xl mx-auto">
                <h2 class="text-[9px] font-black text-slate-500 uppercase tracking-[0.4em] mb-6">Trending Communities</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div class="glass-card p-6 border-indigo-500/20 hover:border-indigo-500/40 transition-all cursor-pointer group" onclick="enterRoom('Married & Curious')">
                        <div class="flex justify-between items-start mb-4"><h4 class="font-black text-xs uppercase tracking-tight group-hover:text-indigo-400 transition-colors">Married & Curious</h4><i data-lucide="arrow-up-right" class="w-3 h-3 text-indigo-400"></i></div>
                        <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Featured Feed</p>
                    </div>
                    <div class="glass-card p-6 hover:border-indigo-500/40 transition-all cursor-pointer group" onclick="showScreen('rooms')">
                        <div class="flex justify-between items-start mb-4"><h4 class="font-black text-xs uppercase tracking-tight text-white group-hover:text-indigo-400 transition-colors">Discover All</h4><i data-lucide="layout-grid" class="w-3 h-3 text-slate-500"></i></div>
                        <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">9+ Dynamic Rooms</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 2. INTERESTS -->
    <section id="interests" class="screen pt-28 px-6 items-center">
        <div class="max-w-md w-full">
            <div class="flex items-center gap-4 mb-12"><button onclick="showScreen('landing')" class="w-10 h-10 bg-white/5 border border-white/10 rounded-full flex items-center justify-center text-slate-400 hover:text-white transition-all"><i data-lucide="arrow-left" class="w-4 h-4"></i></button><h2 class="text-3xl font-black uppercase italic tracking-tighter flex-1 text-center">Interest</h2><div class="w-10"></div></div>
            <div class="glass-card p-6 mb-8 shadow-2xl focus-within:border-indigo-500/50 transition-all"><div id="tag-container" class="flex flex-wrap gap-2 mb-4 text-left"></div><input id="tag-input" type="text" placeholder="Type (e.g. Cinema, F1...)" class="w-full bg-transparent outline-none text-xl font-medium text-white"></div>
            <button id="next-to-prefs" disabled onclick="showScreen('preferences')" class="w-full bg-white text-black py-5 rounded-2xl font-black text-lg uppercase shadow-xl disabled:opacity-10 transition-all">Continue</button>
        </div>
    </section>

    <!-- 3. PREFERENCES -->
    <section id="preferences" class="screen pt-28 px-6 items-center pb-20">
        <div class="max-w-lg w-full space-y-4">
            <div class="flex items-center gap-4 mb-10"><button onclick="showScreen('interests')" class="w-10 h-10 bg-white/5 border border-white/10 rounded-full flex items-center justify-center text-slate-400 hover:text-white transition-all"><i data-lucide="arrow-left" class="w-4 h-4"></i></button><h2 class="text-3xl font-black uppercase italic tracking-tighter text-white flex-1 text-center">Filters</h2><div class="w-10"></div></div>
            <div class="glass-card p-8">
                <div class="grid grid-cols-1 gap-3 mb-6">
                    <button onclick="setPref('marital', 'Married', this)" class="pref-btn active p-5 flex items-center justify-between group"><span>Married</span><i data-lucide="heart" class="w-4 h-4"></i></button>
                    <div class="grid grid-cols-2 gap-3"><button onclick="setPref('marital', 'Single', this)" class="pref-btn p-4">Single</button><button onclick="setPref('marital', 'Divorced', this)" class="pref-btn p-4">Divorced</button></div>
                </div>
            </div>
            <button onclick="startMatching()" class="w-full mt-10 bg-indigo-600 text-white py-5 rounded-2xl font-black text-lg uppercase shadow-[0_20px_50px_rgba(99,102,241,0.3)]">Scan Match</button>
        </div>
    </section>

    <!-- 4. MATCHING -->
    <section id="matching" class="screen items-center justify-center bg-black text-center p-6">
        <div class="relative w-56 h-56 flex items-center justify-center mb-12">
            <div class="absolute inset-0 border border-indigo-500/20 rounded-full radar-spin"></div>
            <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center animate-pulse shadow-[0_0_50px_rgba(79,70,229,0.5)]"><i data-lucide="compass" class="w-8 h-8 text-white"></i></div>
        </div>
        <h2 class="text-3xl font-bold italic uppercase tracking-tighter text-white">Scanning...</h2>
        <button onclick="cancelMatch()" class="mt-20 px-10 py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl text-[10px] font-black uppercase shadow-lg transition-all">Cancel</button>
    </section>

    <!-- 5. CHAT -->
    <section id="chat" class="screen bg-black">
        <header class="h-20 border-b border-white/5 flex items-center justify-between px-6 bg-black/80 backdrop-blur-xl sticky top-0 z-20">
            <div class="flex items-center gap-3"><div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center font-black text-sm uppercase text-white shadow-lg">V</div><div><div class="font-bold text-sm italic uppercase text-white" id="chat-pref">Stranger</div><div class="text-[8px] text-green-500 font-bold uppercase tracking-widest">Secured</div></div></div>
            <button onclick="skipChat()" class="bg-red-600 hover:bg-red-700 text-white px-5 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest shadow-lg">Skip</button>
        </header>
        <div id="chat-window" class="flex-1 overflow-y-auto p-6 flex flex-col space-y-4 no-scrollbar pb-32"></div>
        <div class="p-6 bg-black border-t border-white/5 absolute bottom-0 w-full"><div class="max-w-2xl mx-auto flex gap-3 bg-white/5 p-1.5 rounded-2xl border border-white/10 shadow-inner"><input id="chat-input" type="text" placeholder="Start typing..." class="flex-1 bg-transparent px-4 py-3 outline-none text-sm text-white font-medium"><button onclick="sendMessage()" class="bg-indigo-600 text-white w-12 h-12 rounded-xl flex items-center justify-center shadow-lg active:scale-90"><i data-lucide="arrow-up" class="w-6 h-6"></i></button></div></div>
    </section>

    <!-- 6. ROOMS DIRECTORY -->
    <section id="rooms" class="screen pt-24 px-6 pb-20">
        <div class="max-w-2xl mx-auto w-full text-left">
            <div class="flex items-center gap-4 mb-10"><button onclick="showScreen('landing')" class="w-10 h-10 bg-white/5 border border-white/10 rounded-full flex items-center justify-center text-slate-400 hover:text-white"><i data-lucide="chevron-left"></i></button><h2 class="text-3xl font-black uppercase italic">Vibe <span class="text-indigo-500">Rooms</span></h2></div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3" id="room-list"></div>
        </div>
    </section>

    <!-- 7. ROOM FEED -->
    <section id="room-feed" class="screen pt-20 px-6 pb-24">
        <div class="max-w-2xl mx-auto w-full text-left">
            <div class="flex items-center justify-between mb-8 sticky top-20 z-30 bg-black/50 backdrop-blur-md py-4 px-4 rounded-2xl border border-white/5 shadow-2xl"><button onclick="showScreen('rooms')" class="text-slate-500"><i data-lucide="chevron-left"></i></button><h2 id="current-room-name" class="text-lg font-black uppercase italic text-indigo-500 tracking-tight text-center flex-1">Room Name</h2><button onclick="openCreatePost()" class="bg-indigo-600 p-2.5 rounded-xl text-white shadow-lg"><i data-lucide="plus" class="w-5 h-5"></i></button></div><div id="posts-container" class="space-y-6"></div>
        </div>
    </section>

    <!-- MODALS -->
    <div id="post-modal" class="fixed inset-0 z-[100] bg-black/95 backdrop-blur-xl hidden flex items-center justify-center p-6"><div class="glass-card p-8 w-full max-w-md border-indigo-500/30"><h3 id="room-prompt" class="text-lg font-bold italic text-white text-center mb-6">...</h3><textarea id="post-text" placeholder="Share your thoughts..." class="w-full h-40 bg-white/5 border border-white/10 rounded-2xl p-4 outline-none text-white text-sm mb-6 focus:border-indigo-500 transition-all"></textarea><div class="flex gap-3"><button onclick="closeCreatePost()" class="flex-1 bg-white/5 p-4 rounded-xl font-bold uppercase text-[10px] text-slate-400">Cancel</button><button onclick="submitPost()" class="flex-1 bg-indigo-600 p-4 rounded-xl font-bold uppercase text-[10px] text-white">Post</button></div></div></div>
    <div id="login-modal" class="fixed inset-0 z-[110] bg-black/95 backdrop-blur-xl hidden flex flex-col items-center justify-center p-8 text-center"><div class="w-20 h-20 bg-indigo-600 rounded-3xl flex items-center justify-center mb-6 shadow-2xl"><i data-lucide="user-plus" class="w-10 h-10"></i></div><h2 class="text-3xl font-black italic uppercase mb-2 text-white">Member Only</h2><p class="text-slate-400 mb-8 max-w-xs text-sm">Join the discussion by logging in with Google.</p><button onclick="login()" class="bg-white text-black px-10 py-4 rounded-xl font-black uppercase text-[10px] tracking-widest hover:bg-indigo-600 hover:text-white transition-all">Sign In With Google</button><button onclick="closeLoginModal()" class="mt-6 text-slate-600 font-bold uppercase text-[10px]">Back</button></div>

    <script>
        // --- PRESERVE YOUR ADMIN UID ---
        const ADMIN_UID = "FTIrpPutrvU6NM6ggHEdJplKgUY2"; 

        const firebaseConfig = { 
            apiKey: "AIzaSyDjve9Lpih3Tl4mNGn1gxdZ6RQqONs7Bo4", 
            authDomain: "vibe-78d6f.firebaseapp.com", // DEFAULT DOMAIN (ensure it works)
            databaseURL: "https://vibe-78d6f-default-rtdb.firebaseio.com", 
            projectId: "vibe-78d6f", 
            storageBucket: "vibe-78d6f.firebasestorage.app", 
            messagingSenderId: "676783066321", 
            appId: "1:676783066321:web:4b9535e39559df464b09f0" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        let myId = null, myNick = "Viber", isLogged = false, interests = [], prefs = { marital: 'Married', style: 'Deep Talk' }, currentRoom = null, activeRoomName = null;

        const VIBE_ROOMS = ['Married & Curious', 'Couples', 'First Experiences', 'Open Relationships', 'Dating & Connection', 'Fantasy & Roleplay', 'Relationship Advice', 'Experiences', 'Questions & Discussions'];
        const MOCK_ROOM_DATA = { 'Married & Curious': [{ text: "Is it normal to feel a sudden spark for an old friend after 10 years of marriage?", likes: 42 }], 'default': [{ text: "Does anyone else find it easier to talk to strangers than people they know?", likes: 12 }] };
        const ROOM_PROMPTS = { 'Married & Curious': "What are you curious about but haven't talked about openly?", 'Relationship Advice': "What's something you're currently trying to figure out?", 'default': "Share your thoughts with the community..." };

        auth.onAuthStateChanged(user => {
            const authArea = document.getElementById('nav-auth-area');
            if (user && !user.isAnonymous) {
                myId = user.uid; isLogged = true; myNick = user.displayName || "Viber";
                authArea.innerHTML = `<span class="hidden md:inline text-[9px] font-black text-slate-500 uppercase mr-3">${myNick.split(' ')[0]}</span><button onclick="logout()" class="text-[9px] font-black text-red-500 uppercase tracking-widest border border-red-500/20 px-3 py-1.5 rounded-lg">Logout</button>`;
            } else {
                myId = user ? user.uid : null; isLogged = false;
                authArea.innerHTML = `<button onclick="login()" class="bg-indigo-600 text-white px-5 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest shadow-lg">Sign In</button>`;
                if(!user) auth.signInAnonymously();
            }
        });

        window.login = () => { const provider = new firebase.auth.GoogleAuthProvider(); auth.signInWithPopup(provider).catch(e => alert("Login failed. Check Authorized Domains.")); closeLoginModal(); };
        window.logout = () => auth.signOut().then(() => location.reload());

        window.showScreen = (id) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if (id === 'rooms') renderRoomDirectory();
            window.scrollTo(0,0); lucide.createIcons();
        };

        function renderRoomDirectory() {
            const container = document.getElementById('room-list');
            container.innerHTML = VIBE_ROOMS.map(room => `<div class="glass-card p-6 flex justify-between items-center hover:border-indigo-500 transition-all cursor-pointer group" onclick="enterRoom('${room}')"><h3 class="font-black text-xs uppercase italic text-white group-hover:text-indigo-400 transition-colors">${room}</h3><i data-lucide="chevron-right" class="w-4 h-4 text-slate-600"></i></div>`).join('');
            lucide.createIcons();
        }

        window.enterRoom = (roomName) => { activeRoomName = roomName; document.getElementById('current-room-name').innerText = roomName; showScreen('room-feed'); loadRoomPosts(roomName); };

        function loadRoomPosts(roomName) {
            const container = document.getElementById('posts-container'); container.innerHTML = '';
            const mocks = MOCK_ROOM_DATA[roomName] || MOCK_ROOM_DATA['default'];
            mocks.forEach((m, index) => renderSinglePost(m, true, `mock-${index}`));

            db.ref(`room_posts/${roomName}`).limitToLast(20).on('value', snap => {
                const posts = snap.val() || {};
                document.querySelectorAll('.real-post').forEach(el => el.remove());
                for (let id in posts) { if (posts[id].text) { renderSinglePost(posts[id], false, id); } }
                lucide.createIcons();
            });
        }

        function renderSinglePost(p, isMock, id) {
            const container = document.getElementById('posts-container');
            const div = document.createElement('div');
            div.className = `glass-card p-6 space-y-4 ${isMock ? 'border-indigo-500/20' : 'real-post'}`;
            div.innerHTML = `
                ${isMock ? '<div class="text-[8px] font-black text-indigo-400 uppercase tracking-[0.3em] mb-2">Featured</div>' : ''}
                <p class="text-[13px] text-slate-200 leading-relaxed font-medium">${p.text}</p>
                <div class="flex items-center justify-between border-t border-white/5 pt-4">
                    <div class="flex gap-5">
                        <button onclick="${isMock ? '' : `reactPost('${id}')`}" class="flex items-center gap-1.5 text-[9px] font-black text-slate-500 hover:text-indigo-400 transition-all"><i data-lucide="heart" class="w-3.5 h-3.5"></i> ${p.likes || 0}</button>
                        <button onclick="toggleComments('${id}')" class="flex items-center gap-1.5 text-[9px] font-black text-slate-500 hover:text-indigo-400 transition-all"><i data-lucide="message-circle" class="w-3.5 h-3.5"></i> Discussion</button>
                    </div>
                    ${(myId === ADMIN_UID && !isMock) ? `<button onclick="adminDeletePost('${id}')" class="text-red-500 font-black text-[9px] uppercase tracking-widest bg-red-500/10 px-3 py-1.5 rounded-lg">Delete</button>` : ''}
                </div>
                <div id="comments-${id}" class="hidden space-y-4 pt-4 border-t border-white/5">
                    <div class="comments-list space-y-3" id="list-${id}"></div>
                    ${isLogged ? `<div class="flex gap-2 mt-4 bg-white/5 p-1 rounded-xl"><input id="input-${id}" type="text" placeholder="Perspective..." class="flex-1 bg-transparent px-3 py-2 text-xs text-white outline-none font-medium"><button onclick="submitComment('${id}', ${isMock})" class="bg-indigo-600 px-4 py-2 rounded-lg text-[9px] font-black uppercase">Post</button></div>` : `<button onclick="openLoginModal()" class="w-full bg-white/5 border border-dashed border-white/20 p-4 rounded-xl text-[9px] text-slate-400 font-black uppercase">Sign in to Discuss</button>`}
                </div>`;
            container.insertAdjacentElement(isMock ? 'beforeend' : 'afterbegin', div);
            if(!isMock) loadComments(id);
        }

        window.toggleComments = (id) => document.getElementById(`comments-${id}`).classList.toggle('hidden');
        function loadComments(postId) {
            db.ref(`room_posts/${activeRoomName}/${postId}/comments`).on('value', snap => {
                const list = document.getElementById(`list-${postId}`);
                if(!list) return; list.innerHTML = '';
                const comments = snap.val() || {};
                for(let cid in comments) {
                    const c = comments[cid];
                    list.innerHTML += `<div class="bg-white/5 p-4 rounded-2xl flex justify-between"><div><span class="text-[8px] font-black text-indigo-400 uppercase tracking-widest">${c.nick || 'Member'}</span><p class="text-[11px] text-slate-300 mt-1.5">${c.text}</p></div>${(myId === ADMIN_UID) ? `<button onclick="adminDeleteComment('${postId}', '${cid}')" class="text-red-500 opacity-30 hover:opacity-100"><i data-lucide="trash-2" class="w-3 h-3"></i></button>` : ''}</div>`;
                }
                lucide.createIcons();
            });
        }

        window.submitComment = (postId, isMock) => {
            if(isMock) { alert("Start a new discussion!"); return; }
            const input = document.getElementById(`input-${postId}`);
            if(!input.value.trim()) return;
            db.ref(`room_posts/${activeRoomName}/${postId}/comments`).push({ text: input.value.trim(), nick: myNick, uid: myId, time: firebase.database.ServerValue.TIMESTAMP });
            input.value = '';
        };

        window.adminDeletePost = (id) => { if(confirm("Confirm Delete?")) db.ref(`room_posts/${activeRoomName}/${id}`).remove(); };
        window.adminDeleteComment = (pid, cid) => { if(confirm("Confirm Delete?")) db.ref(`room_posts/${activeRoomName}/${pid}/comments/${cid}`).remove(); };
        window.reactPost = (postId) => db.ref(`room_posts/${activeRoomName}/${postId}/likes`).transaction(c => (c || 0) + 1);

        window.openCreatePost = () => { if(!isLogged) { openLoginModal(); return; } const prompt = ROOM_PROMPTS[activeRoomName] || ROOM_PROMPTS['default']; document.getElementById('room-prompt').innerText = prompt; document.getElementById('post-modal').classList.remove('hidden'); };
        window.closeCreatePost = () => document.getElementById('post-modal').classList.add('hidden');
        window.openLoginModal = () => document.getElementById('login-modal').classList.remove('hidden');
        window.closeLoginModal = () => document.getElementById('login-modal').classList.add('hidden');
        window.submitPost = () => {
            const text = document.getElementById('post-text').value.trim(); if (!text) return;
            db.ref(`room_posts/${activeRoomName}`).push({ uid: myId, text: text, time: firebase.database.ServerValue.TIMESTAMP, likes: 0 });
            document.getElementById('post-text').value = ''; closeCreatePost();
        };

        // --- MATCHMAKING & CHAT ---
        window.cancelMatch = () => { db.ref(`notif/${myId}`).remove(); db.ref('queue').child(myId).remove(); showScreen('landing'); };
        window.skipChat = () => { if (currentRoom) db.ref(`rooms/${currentRoom}/status`).set('ended'); db.ref(`notif/${myId}`).remove(); db.ref('queue').child(myId).remove(); showScreen('landing'); };
        window.startMatching = () => {
            currentRoom = null; showScreen('matching'); const myNotifyRef = db.ref(`notif/${myId}`); myNotifyRef.remove();
            myNotifyRef.on('value', (snap) => { const data = snap.val(); if (data && data.roomId) { myNotifyRef.off(); db.ref('queue').child(myId).remove(); joinChat(data.roomId, data.style); } });
            db.ref('queue').once('value', (snap) => {
                const users = snap.val(); let peer = null;
                if (users) { for (let uid in users) { if (uid === myId) continue; if ((users[uid].interests || []).some(i => interests.includes(i))) { peer = uid; break; } } }
                if (peer) {
                    const roomId = [myId, peer].sort().join('_');
                    db.ref(`rooms/${roomId}/status`).set('active'); db.ref(`rooms/${roomId}/messages`).remove();
                    db.ref(`notif/${peer}`).set({ roomId, style: prefs.style }); db.ref('queue').child(peer).remove(); joinChat(roomId, prefs.style);
                } else { db.ref('queue').child(myId).set({ interests, time: Date.now() }); }
            });
        };
        function joinChat(roomId, style) {
            currentRoom = roomId; showScreen('chat'); document.getElementById('chat-pref').innerText = style + " Mode"; document.getElementById('chat-window').innerHTML = ''; document.getElementById('chat-input').disabled = false;
            const msgRef = db.ref(`rooms/${roomId}/messages`); msgRef.off(); msgRef.on('child_added', (snap) => { addUI(snap.val().sender === myId ? 'me' : 'stranger', snap.val().text); });
            const statusRef = db.ref(`rooms/${roomId}/status`); statusRef.on('value', (snap) => { if (snap.val() === 'ended') { addUI('system', 'Stranger has left the wavelength.'); document.getElementById('chat-input').disabled = true; } });
        }
        window.sendMessage = () => { const input = document.getElementById('chat-input'); const val = input.value.trim(); if (!val || !currentRoom) return; db.ref(`rooms/${currentRoom}/messages`).push({ sender: myId, text: val }); input.value = ''; };
        function addUI(sender, text) {
            const box = document.getElementById('chat-window'); const div = document.createElement('div');
            if (sender === 'system') { div.className = "flex flex-col items-center py-10 w-full"; div.innerHTML = `<div class="text-[9px] font-bold text-red-500 uppercase tracking-widest animate-pulse">Session Terminated</div><button onclick="location.reload()" class="mt-4 bg-white text-black px-6 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest">Find New</button>`; }
            else { div.className = `max-w-[85%] px-4 py-2.5 text-[13px] font-medium leading-relaxed ${sender === 'me' ? 'msg-me shadow-lg' : 'msg-them shadow-sm'}`; div.innerText = text; }
            box.appendChild(div); box.scrollTop = box.scrollHeight;
        }

        const tagInput = document.getElementById('tag-input');
        tagInput.addEventListener('keydown', (e) => { if(e.key === 'Enter' && tagInput.value.trim()){ const val = tagInput.value.trim().toLowerCase(); if(!interests.includes(val)){ interests.push(val); renderTags(); } tagInput.value = ''; } });
        function renderTags() { const container = document.getElementById('tag-container'); container.innerHTML = interests.map(t => `<div class="bg-indigo-600 px-3 py-1.5 rounded-xl text-[10px] font-black flex items-center gap-2 uppercase tracking-tight">${t} <i data-lucide="x" class="w-3 h-3 cursor-pointer" onclick="removeTag('${t}')"></i></div>`).join(''); document.getElementById('next-to-prefs').disabled = interests.length < 1; lucide.createIcons(); }
        window.removeTag = (t) => { interests = interests.filter(i => i !== t); renderTags(); }
        window.setPref = (type, val, btn) => { prefs[type] = val; btn.closest('div').parentElement.querySelectorAll('.pref-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }
        document.getElementById('chat-input').onkeydown = (e) => { if(e.key === 'Enter') sendMessage(); };
        setInterval(() => { const c = 2410 + Math.floor(Math.random() * 15); document.getElementById('live-counter').innerText = c.toLocaleString() + " Live"; }, 5000);
        lucide.createIcons();
    </script>
</body>
</html>
