<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIBE | Wavelength Matching & Rooms</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #000; color: #fff; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .screen { display: none; min-height: 100vh; flex-direction: column; position: relative; z-index: 10; }
        .screen.active { display: flex; }
        .pro-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: radial-gradient(circle at 50% -20%, #1e1b4b 0%, #000 85%); }
        .noise { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; opacity: 0.05; pointer-events: none; background-image: url('https://grainy-gradients.vercel.app/noise.svg'); }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 1.5rem; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .msg-me { background: #6366f1; border-radius: 1.25rem 1.25rem 0 1.25rem; align-self: flex-end; }
        .msg-them { background: #1e293b; border-radius: 1.25rem 1.25rem 1.25rem 0; align-self: flex-start; }
        @keyframes scan { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .radar-spin { animation: scan 4s linear infinite; }
    </style>
</head>
<body>

    <div class="pro-bg"></div>
    <div class="noise"></div>

    <!-- PERSISTENT NAV -->
    <nav class="fixed top-0 w-full z-50 h-16 border-b border-white/5 bg-black/50 backdrop-blur-md flex items-center justify-between px-6">
        <div class="flex items-center gap-2 cursor-pointer" onclick="location.reload()">
            <div class="w-7 h-7 bg-indigo-600 rounded flex items-center justify-center text-white shadow-lg"><i data-lucide="zap" class="w-4 h-4 fill-current"></i></div>
            <span class="text-lg font-bold tracking-tighter uppercase italic text-white">VIBE</span>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="showScreen('rooms')" class="text-[10px] font-bold uppercase tracking-widest text-slate-400 hover:text-indigo-400 transition-colors">Rooms</button>
            <div id="auth-status" class="flex items-center gap-2 bg-white/5 px-3 py-1 rounded-full border border-white/10">
                <span class="w-1 h-1 bg-green-500 rounded-full animate-pulse"></span>
                <span id="live-counter" class="text-[9px] font-bold uppercase tracking-widest text-slate-400">2,410 Live</span>
            </div>
        </div>
    </nav>

    <!-- SCREEN 1: LANDING -->
    <section id="landing" class="screen active pt-32 px-6 items-center text-center">
        <div class="max-w-3xl">
            <h1 class="text-5xl md:text-7xl font-extrabold tracking-tighter leading-none mb-6 uppercase italic text-white">Meet on your <br/><span class="text-indigo-500">wavelength.</span></h1>
            <button onclick="showScreen('interests')" class="bg-white text-black px-12 py-5 rounded-2xl font-black text-lg uppercase tracking-tighter hover:bg-indigo-600 hover:text-white transition-all shadow-2xl">Start Vibing</button>
            
            <div class="mt-24 w-full text-left">
                <h2 class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.3em] mb-6">Explore Vibe Rooms</h2>
                <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                    <div class="glass-card p-5 border-indigo-500/20" onclick="enterRoom('Married & Curious')">
                        <h4 class="font-bold text-xs uppercase mb-1">Married & Curious</h4>
                        <p class="text-[9px] text-indigo-400 font-bold tracking-widest">Featured Posts</p>
                    </div>
                    <div class="glass-card p-5" onclick="enterRoom('Relationship Advice')">
                        <h4 class="font-bold text-xs uppercase mb-1 text-white">Advice</h4>
                        <p class="text-[9px] text-slate-500 font-bold">Trending Now</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- SCREEN: ROOM DIRECTORY -->
    <section id="rooms" class="screen pt-24 px-6 pb-20">
        <div class="max-w-2xl mx-auto w-full">
            <div class="flex items-center gap-4 mb-8">
                <button onclick="showScreen('landing')" class="text-slate-500 hover:text-white transition-all"><i data-lucide="chevron-left"></i></button>
                <h2 class="text-3xl font-black uppercase italic">Vibe <span class="text-indigo-500">Rooms</span></h2>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3" id="room-list"></div>
        </div>
    </section>

    <!-- SCREEN: ROOM FEED -->
    <section id="room-feed" class="screen pt-20 px-6 pb-24">
        <div class="max-w-2xl mx-auto w-full">
            <div class="flex items-center justify-between mb-8 sticky top-20 z-30 bg-black/50 backdrop-blur-md py-3 px-4 rounded-2xl border border-white/5 shadow-xl">
                <button onclick="showScreen('rooms')" class="text-slate-500"><i data-lucide="chevron-left"></i></button>
                <h2 id="current-room-name" class="text-lg font-black uppercase italic text-indigo-500 tracking-tight">Room Name</h2>
                <button onclick="openCreatePost()" class="bg-indigo-600 p-2.5 rounded-xl text-white shadow-lg shadow-indigo-500/20 hover:scale-105 active:scale-95 transition-all"><i data-lucide="plus" class="w-5 h-5"></i></button>
            </div>
            <div id="posts-container" class="space-y-6"></div>
        </div>
    </section>

    <!-- MODAL: CREATE POST -->
    <div id="post-modal" class="fixed inset-0 z-[100] bg-black/90 backdrop-blur-md hidden flex items-center justify-center p-6">
        <div class="glass-card p-8 w-full max-w-md border-indigo-500/30">
            <h3 id="room-prompt" class="text-lg font-bold italic leading-snug mb-6 text-white text-center">...</h3>
            <textarea id="post-text" placeholder="Share your thoughts..." class="w-full h-40 bg-white/5 border border-white/10 rounded-2xl p-4 outline-none text-white text-sm mb-6 focus:border-indigo-500 transition-all"></textarea>
            <div class="flex gap-3">
                <button onclick="closeCreatePost()" class="flex-1 bg-white/5 p-4 rounded-xl font-bold uppercase text-[10px] text-slate-400">Cancel</button>
                <button onclick="submitPost()" class="flex-1 bg-indigo-600 p-4 rounded-xl font-bold uppercase text-[10px] text-white shadow-lg">Post</button>
            </div>
        </div>
    </div>

    <!-- MODAL: LOGIN PROMPT -->
    <div id="login-modal" class="fixed inset-0 z-[110] bg-black/95 backdrop-blur-md hidden flex flex-col items-center justify-center p-8 text-center">
        <div class="w-20 h-20 bg-indigo-600 rounded-3xl flex items-center justify-center mb-6 shadow-2xl shadow-indigo-500/30"><i data-lucide="user-plus" class="w-10 h-10"></i></div>
        <h2 class="text-3xl font-black italic uppercase mb-2 text-white">Member Only</h2>
        <p class="text-slate-400 mb-8 max-w-xs">Join VibeDeep to contribute to the community and join discussions.</p>
        <button onclick="location.reload()" class="bg-white text-black px-10 py-4 rounded-xl font-bold uppercase text-xs tracking-widest hover:bg-indigo-600 hover:text-white transition-all">Login / Sign Up</button>
        <button onclick="closeLoginModal()" class="mt-6 text-slate-600 font-bold uppercase text-[10px] hover:text-white transition-colors">Maybe later</button>
    </div>

    <!-- RADAR & CHAT ENGINE (Preserved) -->
    <section id="interests" class="screen pt-28 px-6 items-center">
        <div class="max-w-md w-full">
            <div class="flex items-center gap-4 mb-8 justify-center">
                <button onclick="showScreen('landing')" class="text-slate-500"><i data-lucide="chevron-left"></i></button>
                <h2 class="text-3xl font-bold uppercase italic">Interests</h2>
            </div>
            <div class="glass-card p-6 mb-8"><div id="tag-container" class="flex flex-wrap gap-2 mb-4"></div><input id="tag-input" type="text" placeholder="Add interest..." class="w-full bg-transparent outline-none text-xl text-white"></div>
            <button id="next-to-prefs" disabled onclick="showScreen('preferences')" class="w-full bg-indigo-600 py-5 rounded-2xl font-black text-lg uppercase shadow-xl disabled:opacity-10 transition-all">Continue</button>
        </div>
    </section>

    <section id="preferences" class="screen pt-28 px-6 items-center">
        <div class="max-w-md w-full">
            <div class="flex items-center gap-4 mb-8 justify-center">
                <button onclick="showScreen('interests')" class="text-slate-500"><i data-lucide="chevron-left"></i></button>
                <h2 class="text-3xl font-bold uppercase italic text-white text-center">Fine-tune</h2>
            </div>
            <div class="glass-card p-6 mb-6">
                <label class="text-[10px] font-bold text-slate-500 uppercase block mb-4 text-center">Status Filter</label>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="setPref('marital', 'Single', this)" class="pref-btn active p-3">Single</button>
                    <button onclick="setPref('marital', 'Married', this)" class="pref-btn p-3">Married</button>
                    <button onclick="setPref('marital', 'Divorced', this)" class="pref-btn p-3">Divorced</button>
                </div>
            </div>
            <button onclick="startMatching()" class="w-full mt-10 bg-white text-black py-5 rounded-2xl font-black text-lg uppercase shadow-xl">Scan Wavelength</button>
        </div>
    </section>

    <section id="matching" class="screen items-center justify-center bg-black text-center p-6">
        <div class="relative w-56 h-56 flex items-center justify-center mb-12">
            <div class="absolute inset-0 border border-indigo-500/20 rounded-full radar-spin"></div>
            <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center animate-pulse shadow-[0_0_50px_rgba(79,70,229,0.4)]"><i data-lucide="compass" class="w-8 h-8 text-white"></i></div>
        </div>
        <h2 class="text-3xl font-bold italic uppercase tracking-tighter text-white">Scanning...</h2>
        <button onclick="location.reload()" class="mt-20 px-8 py-3 bg-white/5 border border-white/10 rounded-xl text-[9px] font-bold uppercase tracking-widest hover:text-red-400">Cancel Search</button>
    </section>

    <section id="chat" class="screen bg-black">
        <header class="h-20 border-b border-white/5 flex items-center justify-between px-6 glass-nav sticky top-0 z-20">
            <div class="flex items-center gap-3"><div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center font-bold text-xs text-white uppercase">V</div><div class="font-bold text-sm italic text-white" id="chat-pref">Stranger</div></div>
            <button onclick="skipChat()" class="bg-red-500/10 border border-red-500/20 text-red-500 px-5 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-red-500 hover:text-white transition-all">Skip</button>
        </header>
        <div id="chat-window" class="flex-1 overflow-y-auto p-6 flex flex-col space-y-3 no-scrollbar pb-32"></div>
        <div class="p-4 bg-black border-t border-white/5 absolute bottom-0 w-full"><div class="max-w-2xl mx-auto flex gap-3 bg-white/5 p-2 rounded-2xl border border-white/10"><input id="chat-input" type="text" placeholder="Type a message..." class="flex-1 bg-transparent px-4 py-3 outline-none text-sm text-white"><button onclick="sendMessage()" class="bg-indigo-600 text-white w-12 h-12 rounded-xl flex items-center justify-center shadow-lg hover:scale-105 active:scale-95 transition-all"><i data-lucide="arrow-up" class="w-5 h-5"></i></button></div></div>
    </section>

    <script>
        const ADMIN_UID = "FTIrpPutrvU6NM6ggHEdJplKgUY2"; 
        const firebaseConfig = { apiKey: "AIzaSyDjve9Lpih3Tl4mNGn1gxdZ6RQqONs7Bo4", authDomain: "vibe-78d6f.firebaseapp.com", databaseURL: "https://vibe-78d6f-default-rtdb.firebaseio.com", projectId: "vibe-78d6f", storageBucket: "vibe-78d6f.firebasestorage.app", messagingSenderId: "676783066321", appId: "1:676783066321:web:4b9535e39559df464b09f0" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        let myId = null, myNick = "Viber", isLogged = false, interests = [], prefs = { marital: 'Single', style: 'Deep Talk' }, currentRoom = null, activeRoomName = null;

        const VIBE_ROOMS = ['Married & Curious', 'Couples', 'First Experiences', 'Open Relationships', 'Dating & Connection', 'Fantasy & Roleplay', 'Relationship Advice', 'Experiences', 'Questions & Discussions'];

        const MOCK_ROOM_DATA = {
            'Married & Curious': [{ text: "Why is it that my husband's best friend is starting to look so attractive lately? Is this just a phase or something more?", likes: 42 }, { text: "Is there a safe way to explore curiosity without breaking trust? New to this and looking for real perspectives.", likes: 18 }],
            'Couples': [{ text: "We tried a lifestyle club for the first time last weekend in Mumbai. Totally different than what we expected!", likes: 56 }, { text: "Logistics check: How do you guys manage 'date nights' when you have a shared social circle?", likes: 23 }],
            'Relationship Advice': [{ text: "How do you handle it when you want deep talks but your partner just wants casual vibes all the time?", likes: 89 }],
            'Experiences': [{ text: "Met someone on Vibe from Kochi today and we talked for 4 hours about life. Best match yet.", likes: 112 }],
            'default': [{ text: "Does anyone else feel like the best conversations happen after midnight?", likes: 12 }]
        };

        const ROOM_PROMPTS = { 'Married & Curious': "What are you curious about but haven't talked about openly?", 'Relationship Advice': "What's something you're currently trying to figure out?", 'Questions & Discussions': "Ask the community something you've always wondered about.", 'Fantasy & Roleplay': "What's a scenario you've always wanted to explore?", 'default': "Share your thoughts with the community..." };

        auth.onAuthStateChanged(user => {
            if (user && !user.isAnonymous) {
                myId = user.uid; isLogged = true;
                db.ref(`users/${myId}`).once('value', snap => { if(snap.val()) myNick = snap.val().nickname || "Viber"; });
            } else { myId = user ? user.uid : null; isLogged = false; }
        });

        window.showScreen = (id) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if (id === 'rooms') renderRoomDirectory();
            window.scrollTo(0,0);
            lucide.createIcons();
        };

        function renderRoomDirectory() {
            const container = document.getElementById('room-list');
            container.innerHTML = VIBE_ROOMS.map(room => `
                <div class="glass-card p-6 flex justify-between items-center hover:border-indigo-500/50 transition-all cursor-pointer" onclick="enterRoom('${room}')">
                    <h3 class="font-bold text-sm uppercase italic tracking-tight">${room}</h3>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-500"></i>
                </div>
            `).join('');
            lucide.createIcons();
        }

        window.enterRoom = (roomName) => {
            activeRoomName = roomName;
            document.getElementById('current-room-name').innerText = roomName;
            showScreen('room-feed');
            loadRoomPosts(roomName);
        };

        function loadRoomPosts(roomName) {
            const container = document.getElementById('posts-container');
            container.innerHTML = '';
            
            // Show Mock Data First
            const mocks = MOCK_ROOM_DATA[roomName] || MOCK_ROOM_DATA['default'];
            mocks.forEach((m, index) => renderSinglePost(m, true, `mock-${index}`));

            // Show Real Database Data
            db.ref(`room_posts/${roomName}`).limitToLast(20).on('value', snap => {
                const posts = snap.val() || {};
                // Clear only the real posts section if you want to keep mocks at top
                document.querySelectorAll('.real-post').forEach(el => el.remove());
                for (let id in posts) { renderSinglePost(posts[id], false, id); }
                lucide.createIcons();
            });
        }

        function renderSinglePost(p, isMock, id) {
            const container = document.getElementById('posts-container');
            const isAdmin = (myId === ADMIN_UID);
            const div = document.createElement('div');
            div.className = `glass-card p-5 space-y-4 ${isMock ? 'border-indigo-500/20' : 'real-post'}`;
            div.innerHTML = `
                ${isMock ? '<div class="text-[8px] font-black text-indigo-400 uppercase tracking-widest mb-1">Featured</div>' : ''}
                <p class="text-sm text-slate-300 leading-relaxed">${p.text}</p>
                <div class="flex items-center justify-between border-t border-white/5 pt-4">
                    <div class="flex gap-4">
                        <button onclick="${isMock ? '' : `reactPost('${id}')`}" class="flex items-center gap-1.5 text-[9px] font-bold text-slate-500 hover:text-indigo-400 transition-all"><i data-lucide="heart" class="w-3.5 h-3.5"></i> ${p.likes || 0}</button>
                        <button onclick="toggleComments('${id}')" class="flex items-center gap-1.5 text-[9px] font-bold text-slate-500 hover:text-indigo-400 transition-all"><i data-lucide="message-circle" class="w-3.5 h-3.5"></i> Join Discussion</button>
                    </div>
                    ${isAdmin && !isMock ? `<button onclick="adminDeletePost('${id}')" class="text-red-500 font-black text-[9px] uppercase tracking-widest bg-red-500/10 px-2 py-1 rounded">Delete</button>` : `<button onclick="alert('Reported')" class="text-[9px] text-slate-600 font-bold uppercase">Report</button>`}
                </div>
                <div id="comments-${id}" class="hidden space-y-3 pt-4 border-t border-white/5">
                    <div class="comments-list space-y-2" id="list-${id}"></div>
                    ${isLogged ? `
                        <div class="flex gap-2 mt-4">
                            <input id="input-${id}" type="text" placeholder="Add a comment..." class="flex-1 bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-xs outline-none text-white focus:border-indigo-500">
                            <button onclick="submitComment('${id}')" class="bg-indigo-600 px-3 py-2 rounded-lg text-[9px] font-black uppercase">Send</button>
                        </div>
                    ` : `<div onclick="openLoginModal()" class="cursor-pointer bg-white/5 p-3 rounded-xl border border-dashed border-white/10 text-[8px] text-slate-500 uppercase text-center py-2 italic">Login to join this discussion</div>`}
                </div>
            `;
            container.insertAdjacentElement(isMock ? 'beforeend' : 'afterbegin', div);
            if(!isMock) loadComments(id);
        }

        window.toggleComments = (id) => document.getElementById(`comments-${id}`).classList.toggle('hidden');

        function loadComments(postId) {
            db.ref(`room_posts/${activeRoomName}/${postId}/comments`).on('value', snap => {
                const list = document.getElementById(`list-${postId}`);
                if(!list) return;
                list.innerHTML = '';
                const comments = snap.val() || {};
                for(let cid in comments) {
                    const c = comments[cid];
                    list.innerHTML += `<div class="bg-white/5 p-3 rounded-xl flex justify-between items-start"><div><span class="text-[8px] font-black text-indigo-400 uppercase tracking-widest">${c.nick || 'Member'}</span><p class="text-[11px] text-slate-300 mt-1">${c.text}</p></div>${(myId === ADMIN_UID) ? `<button onclick="adminDeleteComment('${postId}', '${cid}')" class="text-red-500 opacity-50 hover:opacity-100"><i data-lucide="trash-2" class="w-3 h-3"></i></button>` : ''}</div>`;
                }
                lucide.createIcons();
            });
        }

        window.submitComment = (postId) => {
            const input = document.getElementById(`input-${postId}`);
            if(!input.value.trim()) return;
            db.ref(`room_posts/${activeRoomName}/${postId}/comments`).push({ text: input.value.trim(), nick: myNick, uid: myId, time: firebase.database.ServerValue.TIMESTAMP });
            input.value = '';
        };

        window.openCreatePost = () => { if(!isLogged) { document.getElementById('login-modal').classList.remove('hidden'); return; } const prompt = ROOM_PROMPTS[activeRoomName] || ROOM_PROMPTS['default']; document.getElementById('room-prompt').innerText = prompt; document.getElementById('post-modal').classList.remove('hidden'); };
        window.closeCreatePost = () => document.getElementById('post-modal').classList.add('hidden');
        window.openLoginModal = () => document.getElementById('login-modal').classList.remove('hidden');
        window.closeLoginModal = () => document.getElementById('login-modal').classList.add('hidden');

        window.submitPost = () => {
            const text = document.getElementById('post-text').value.trim();
            if (!text) return;
            db.ref(`room_posts/${activeRoomName}`).push({ uid: myId, text: text, time: firebase.database.ServerValue.TIMESTAMP, likes: 0 });
            document.getElementById('post-text').value = ''; closeCreatePost();
        };

        window.adminDeletePost = (id) => { if(confirm("Delete?")) db.ref(`room_posts/${activeRoomName}/${id}`).remove(); };
        window.adminDeleteComment = (pid, cid) => { if(confirm("Delete?")) db.ref(`room_posts/${activeRoomName}/${pid}/comments/${cid}`).remove(); };
        window.reactPost = (postId) => db.ref(`room_posts/${activeRoomName}/${postId}/likes`).transaction(c => (c || 0) + 1);

        // (PRESERVED MATCHMAKING logic - Unchanged)
        const tagInput = document.getElementById('tag-input');
        tagInput.addEventListener('keydown', (e) => { if(e.key === 'Enter' && tagInput.value.trim()){ const val = tagInput.value.trim().toLowerCase(); if(!interests.includes(val)){ interests.push(val); renderTags(); } tagInput.value = ''; } });
        function renderTags() { const container = document.getElementById('tag-container'); container.innerHTML = interests.map(t => `<div class="bg-indigo-600 px-3 py-1.5 rounded-xl text-[10px] font-bold flex items-center gap-2">${t} <i data-lucide="x" class="w-3 h-3 cursor-pointer" onclick="removeTag('${t}')"></i></div>`).join(''); document.getElementById('next-to-prefs').disabled = interests.length < 1; lucide.createIcons(); }
        window.removeTag = (t) => { interests = interests.filter(i => i !== t); renderTags(); }
        window.setPref = (type, val, btn) => { prefs[type] = val; btn.parentElement.parentElement.querySelectorAll('.pref-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }
        window.startMatching = () => { currentRoom = null; showScreen('matching'); const myNotifyRef = db.ref(`notif/${myId}`); myNotifyRef.remove(); myNotifyRef.on('value', (snap) => { const data = snap.val(); if (data && data.roomId) { myNotifyRef.off(); db.ref('queue').child(myId).remove(); joinChat(data.roomId, data.style); } }); db.ref('queue').once('value', (snap) => { const users = snap.val(); let peer = null; if (users) { for (let uid in users) { if (uid === myId) continue; const shared = (users[uid].interests || []).some(i => interests.includes(i)); if (shared) { peer = uid; break; } } } if (peer) { const roomId = [myId, peer].sort().join('_'); db.ref(`rooms/${roomId}/status`).set('active'); db.ref(`rooms/${roomId}/messages`).remove(); db.ref(`notif/${peer}`).set({ roomId, style: prefs.style }); db.ref('queue').child(peer).remove(); joinChat(roomId, prefs.style); } else { db.ref('queue').child(myId).set({ interests, time: Date.now() }); } }); };
        function joinChat(roomId, style) { currentRoom = roomId; showScreen('chat'); document.getElementById('chat-pref').innerText = style + " Mode"; document.getElementById('chat-window').innerHTML = ''; document.getElementById('chat-input').disabled = false; const msgRef = db.ref(`rooms/${roomId}/messages`); msgRef.off(); msgRef.on('child_added', (snap) => { const msg = snap.val(); addUI(msg.sender === myId ? 'me' : 'stranger', msg.text); }); const statusRef = db.ref(`rooms/${roomId}/status`); statusRef.on('value', (snap) => { if (snap.val() === 'ended') { addUI('system', 'Stranger has left the wavelength.'); document.getElementById('chat-input').disabled = true; } }); }
        window.sendMessage = () => { const input = document.getElementById('chat-input'); const val = input.value.trim(); if (!val || !currentRoom) return; db.ref(`rooms/${currentRoom}/messages`).push({ sender: myId, text: val }); input.value = ''; };
        window.skipChat = () => { if (currentRoom) db.ref(`rooms/${currentRoom}/status`).set('ended'); setTimeout(() => location.reload(), 100); };
        function addUI(sender, text) { const box = document.getElementById('chat-window'); const div = document.createElement('div'); if (sender === 'system') { div.className = "flex flex-col items-center py-10 w-full"; div.innerHTML = `<div class="text-[9px] font-bold text-red-500 uppercase py-4 animate-pulse">${text}</div><button onclick="location.reload()" class="mt-4 bg-white text-black px-6 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest">Find New</button>`; } else { div.className = `max-w-[85%] px-4 py-2.5 text-sm font-medium ${sender === 'me' ? 'msg-me' : 'msg-them'}`; div.innerText = text; } box.appendChild(div); box.scrollTop = box.scrollHeight; }
        document.getElementById('chat-input').onkeydown = (e) => { if(e.key === 'Enter') sendMessage(); };
        setInterval(() => { const c = 2410 + Math.floor(Math.random() * 15); document.getElementById('live-counter').innerText = c.toLocaleString() + " Live"; }, 5000);
        lucide.createIcons();
    </script>
</body>
