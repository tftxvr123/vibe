<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>VIBE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#020617] text-white font-sans">
    <nav class="p-6 flex justify-between items-center border-b border-white/5">
        <div class="flex items-center gap-2 font-black italic text-xl"><div class="w-8 h-8 bg-indigo-600 rounded-lg"></div>VIBE</div>
        <div id="nav-actions" class="flex gap-4">
            <a href="auth.html" class="text-xs font-bold uppercase text-indigo-400">Login</a>
        </div>
    </nav>
    <section class="flex flex-col items-center pt-40 text-center px-6">
        <h1 class="text-7xl font-black mb-6 tracking-tighter">MEET ON YOUR <br><span class="text-indigo-500 italic">WAVELENGTH.</span></h1>
        <a href="interests.html" class="bg-indigo-600 px-12 py-5 rounded-2xl font-bold text-xl shadow-2xl">START VIBING</a>
    </section>
    <script type="module">
        import { auth, onAuthStateChanged } from './config.js';
        onAuthStateChanged(auth, (user) => {
            if(user) {
                document.getElementById('nav-actions').innerHTML = `
                    <a href="social.html" class="text-slate-400"><i data-lucide="users"></i></a>
                    <a href="index.html" onclick="auth.signOut()" class="text-slate-400"><i data-lucide="log-out"></i></a>
                `;
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
