<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIBE | Meet on your wavelength</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f8fafc; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .screen { display: none; min-height: 100vh; flex-direction: column; }
        .screen.active { display: flex; }
        .vibe-bg { background: radial-gradient(circle at top right, #312e81 0%, #0f172a 50%); position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .glass-card { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .pref-btn.active { background: #4f46e5; border-color: #6366f1; color: white; box-shadow: 0 0 20px rgba(79, 70, 229, 0.4); transform: scale(0.98); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        @keyframes scan { 0% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.3); opacity: 0.1; } 100% { transform: scale(1); opacity: 0.5; } }
        .scanner { animation: scan 3s ease-in-out infinite; }
    </style>
</head>
<body>

    <div class="vibe-bg"></div>

    <!-- NAV -->
    <nav id="nav" class="fixed top-0 w-full z-50 glass border-b border-white/5 h-16 flex items-center justify-between px-6">
        <div class="flex items-center gap-2 cursor-pointer" onclick="location.reload()">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white shadow-lg shadow-indigo-500/20"><i data-lucide="zap" class="w-5 h-5 fill-current"></i></div>
            <span class="text-xl font-extrabold tracking-tighter italic text-white">VIBE</span>
        </div>
        <div class="flex items-center gap-2 bg-white/5 px-3 py-1.5 rounded-full border border-white/10">
            <span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span>
            <span id="user-count" class="text-[9px] font-bold uppercase tracking-widest text-slate-300">241 Vibing</span>
        </div>
    </nav>

    <!-- 1. LANDING -->
    <section id="landing" class="screen active pt-40 px-6 items-center text-center">
        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-[10px] font-bold uppercase tracking-[0.2em] mb-8">🇮🇳 Exclusively for India</div>
        <h1 class="text-6xl md:text-8xl font-black mb-8 tracking-tighter leading-tight">Meet on your <br/><span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-violet-400 italic font-medium">wavelength.</span></h1>
        <button onclick="window.showScreen('interests')" class="bg-indigo-600 text-white px-12 py-5 rounded-2xl font-bold text-xl shadow-2xl shadow-indigo-500/30 hover:scale-105 active:scale-95 transition-all">START VIBING</button>
    </section>

    <!-- 2. INTERESTS -->
    <section id="interests" class="screen pt-28 px-6 items-center">
        <div class="max-w-md w-full text-center">
            <h2 class="text-4xl font-black mb-10 tracking-tight">What's your vibe?</h2>
            <div class="glass-card rounded-[2.5rem] p-6 shadow-2xl focus-within:border-indigo-500 transition-all text-left">
                <div id="tag-container" class="flex flex-wrap gap-2 mb-4"></div>
                <input id="tag-input" type="text" placeholder="Type (e.g. Cricket, AI)..." class="w-full bg-transparent outline-none text-xl font-medium py-1 text-white">
            </div>
            <div class="fixed bottom-10 left-0 w-full px-6 flex justify-center">
                <button id="next-to-prefs" disabled onclick="window.showScreen('preferences')" class="max-w-md w-full bg-indigo-600 text-white py-5 rounded-2xl font-bold text-lg shadow-xl disabled:opacity-20 transition-all">CONTINUE</button>
            </div>
        </div>
    </section>

    <!-- 3. PREFERENCES -->
    <section id="preferences" class="screen pt-28 px-6 items-center overflow-y-auto pb-20">
        <div class="max-w-md w-full">
            <h2 class="text-3xl font-black mb-8 text-center tracking-tight">Fine-tune</h2>
            <div class="space-y-6">
                <div class="glass-card p-6 rounded-[2rem]">
                    <label class="text-[10px] font-bold text-slate-500 uppercase block mb-5 tracking-widest text-center">Marital Status</label>
                    <div class="grid grid-cols-1 gap-2 mb-2">
                        <button onclick="window.setPref('marital', 'Anyone', this)" class="pref-btn active glass border border-white/10 p-4 rounded-2xl font-bold text-xs uppercase tracking-widest">Anyone</button>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="window.setPref('marital', 'Single', this)" class="pref-btn glass border border-white/10 p-4 rounded-xl font-bold text-[10px] uppercase">Single</button>
                        <button onclick="window.setPref('marital', 'Married', this)" class="pref-btn glass border border-white/10 p-4 rounded-xl font-bold text-[10px] uppercase">Married</button>
                        <button onclick="window.setPref('marital', 'Divorced', this)" class="pref-btn glass border border-white/10 p-4 rounded-xl font-bold text-[10px] uppercase">Divorced</button>
                    </div>
                </div>
                <div class="glass-card p-6 rounded-[2rem]">
                    <label class="text-[10px] font-bold text-slate-500 uppercase block mb-5 tracking-widest text-center">Conversation Style</label>
                    <div class="grid grid-cols-1 gap-2 mb-2">
                        <button onclick="window.setPref('style', 'Anything', this)" class="pref-btn active glass border border-white/10 p-4 rounded-2xl font-bold text-xs uppercase tracking-widest">Anything</button>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="window.setPref('style', 'Deep Talk', this)" class="pref-btn glass border border-white/10 p-4 rounded-2xl font-bold text-[10px] uppercase">Deep Talk</button>
                        <button onclick="window.setPref('style', 'Deep Naughty', this)" class="pref-btn glass border border-white/10 p-4 rounded-2xl font-bold text-[10px] uppercase">Deep Naughty</button>
                    </div>
                </div>
            </div>
            <button onclick="window.startMatching()" class="w-full mt-10 bg-indigo-600 text-white py-5 rounded-2xl font-bold text-xl shadow-2xl">FIND MY VIBE</button>
        </div>
    </section>

    <!-- 4. MATCHING -->
    <section id="matching" class="screen items-center justify-center text-center p-6 bg-[#0f172a]">
        <div class="relative w-48 h-48 flex items-center justify-center mb-12">
            <div class="absolute inset-0 bg-indigo-500 rounded-full scanner opacity-20"></div>
            <div class="relative w-24 h-24 bg-indigo-600 rounded-[2.5rem] flex items-center justify-center shadow-2xl">
                <i data-lucide="compass" class="w-12 h-12 text-white animate-spin"></i>
            </div>
        </div>
        <h2 class="text-3xl font-black mb-4">Finding a vibe...</h2>
    </section>

    <!-- 5. CHAT -->
    <section id="chat" class="screen bg-[#0f172a]">
        <div class="flex flex-col h-screen max-w-2xl mx-auto border-x border-white/5 relative bg-[#0f172a]">
            <!-- Header -->
            <div class="p-4 border-b border-white/5 flex items-center justify-between glass sticky top-0 z-20">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-indigo-600 rounded-2xl flex items-center justify-center text-white font-black">V</div>
                    <div>
                        <div class="font-bold text-sm text-white">Stranger <span class="w-1.5 h-1.5 bg-green-500 rounded-full inline-block ml-1 animate-pulse"></span></div>
                        <div id="mode-label" class="text-[9px] text-indigo-400 font-extrabold uppercase tracking-widest">Connected</div>
                    </div>
                </div>
                <button onclick="window.disconnectAndNext()" class="bg-white text-slate-900 px-5 py-2.5 rounded-xl text-xs font-bold active:scale-95 transition-all uppercase tracking-widest">NEXT / SKIP</button>
            </div>

            <!-- Messages -->
            <div id="chat-window" class="flex-1 overflow-y-auto p-6 space-y-4 no-scrollbar">
                <div class="text-center py-10 opacity-20 text-[10px] font-extrabold uppercase tracking-[0.4em]">Connection Secured</div>
            </div>

            <!-- Composer -->
            <div class="p-4 bg-[#0f172a] border-t border-white/5 sticky bottom-0">
                <div id="typing-ui" class="text-[9px] font-bold text-indigo-400 mb-2 uppercase hidden tracking-widest animate-pulse">Stranger is typing...</div>
                <div id="composer-box" class="flex gap-2 bg-white/5 p-1.5 rounded-2xl border border-white/10 shadow-inner">
                    <input id="chat-input" type="text" placeholder="Type a message..." class="flex-1 bg-transparent px-4 py-3 outline-none font-medium text-sm text-white disabled:opacity-30">
                    <button id="send-btn" onclick="window.sendMessage()" class="bg-indigo-600 text-white w-12 h-12 rounded-xl flex items-center justify-center shadow-lg active:scale-90 transition-all disabled:opacity-30">
                        <i data-lucide="arrow-up" class="w-6 h-6"></i>
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- SCRIPTS -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, onChildAdded, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDjve9Lpih3Tl4mNGn1gxdZ6RQqONs7Bo4",
            authDomain: "vibe-78d6f.firebaseapp.com",
            databaseURL: "https://vibe-78d6f-default-rtdb.firebaseio.com",
            projectId: "vibe-78d6f",
            storageBucket: "vibe-78d6f.firebasestorage.app",
            messagingSenderId: "676783066321",
            appId: "1:676783066321:web:4b9535e39559df464b09f0",
            measurementId: "G-Z7TFPM7SRT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const myId = 'u' + Math.random().toString(36).substr(2, 7);
        
        let interests = [];
        let currentRoom = null;
        let prefs = { style: 'Anything', marital: 'Anyone' };

        // NAVIGATION
        window.showScreen = (id) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('nav').style.display = (id === 'landing' || id === 'interests') ? 'flex' : 'none';
            window.scrollTo(0,0);
            lucide.createIcons();
        };

        // TAGS
        window.addTag = (text) => {
            const val = text.toLowerCase().trim();
            if (!interests.includes(val)) {
                interests.push(val);
                renderTags();
            }
        };

        window.removeTag = (text) => {
            interests = interests.filter(t => t !== text);
            renderTags();
        };

        function renderTags() {
            const container = document.getElementById('tag-container');
            container.innerHTML = interests.map(t => `<div class="flex items-center gap-1.5 bg-indigo-600 text-white px-3 py-1.5 rounded-xl text-[10px] font-bold shadow-lg">${t} <button onclick="window.removeTag('${t}')"><i data-lucide="x" class="w-3 h-3"></i></button></div>`).join('');
            document.getElementById('next-to-prefs').disabled = interests.length < 1; 
            lucide.createIcons();
        }

        window.setPref = (type, val, btn) => {
            prefs[type] = val;
            const parent = btn.closest('.glass-card');
            parent.querySelectorAll('.pref-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        };

        // MATCHMAKING
        window.startMatching = () => {
            window.showScreen('matching');
            const lobbyRef = ref(db, 'lobby/' + myId);
            set(lobbyRef, { id: myId, interests, prefs, time: Date.now() });

            onValue(ref(db, 'lobby'), (snap) => {
                const users = snap.val();
                if (!users || currentRoom) return;
                Object.keys(users).forEach(peerId => {
                    if (peerId === myId || currentRoom) return;
                    const peer = users[peerId];
                    const common = peer.interests.filter(i => interests.includes(i));
                    if (common.length > 0) {
                        const roomId = [myId, peerId].sort().join('_');
                        currentRoom = roomId;
                        set(ref(db, 'lobby/' + peerId + '/match'), { roomId, style: prefs.style });
                        set(ref(db, 'lobby/' + myId + '/match'), { roomId, style: prefs.style });
                        startChat(roomId, prefs.style);
                    }
                });
            });

            onValue(ref(db, 'lobby/' + myId + '/match'), (snap) => {
                const data = snap.val();
                if (data && !currentRoom) {
                    currentRoom = data.roomId;
                    startChat(data.roomId, data.style);
                }
            });
        };

        // CHAT
        function startChat(roomId, style) {
            window.showScreen('chat');
            document.getElementById('mode-label').innerText = style + " Mode";
            document.getElementById('chat-input').disabled = false;
            document.getElementById('send-btn').disabled = false;
            remove(ref(db, 'lobby/' + myId));

            // Room status monitor
            const statusRef = ref(db, 'rooms/' + roomId + '/status');
            set(statusRef, 'active');
            onDisconnect(statusRef).set('disconnected');

            onValue(statusRef, (snap) => {
                if (snap.val() === 'disconnected') {
                    addSystemMessage("Stranger has left the chat.");
                    document.getElementById('chat-input').disabled = true;
                    document.getElementById('send-btn').disabled = true;
                }
            });

            // Message Listeners
            onChildAdded(ref(db, 'rooms/' + roomId + '/messages'), (snap) => {
                const msg = snap.val();
                addMessageUI(msg.sender === myId ? 'me' : 'stranger', msg.text);
            });
        }

        window.disconnectAndNext = () => {
            if (currentRoom) {
                set(ref(db, 'rooms/' + currentRoom + '/status'), 'disconnected');
            }
            location.reload();
        };

        window.sendMessage = () => {
            const input = document.getElementById('chat-input');
            if (!input.value.trim() || !currentRoom) return;
            push(ref(db, 'rooms/' + currentRoom + '/messages'), { sender: myId, text: input.value.trim(), time: Date.now() });
            input.value = '';
        };

        function addMessageUI(sender, text) {
            const box = document.getElementById('chat-window');
            const div = document.createElement('div');
            div.className = `flex ${sender === 'me' ? 'justify-end' : 'justify-start'} mb-3`;
            div.innerHTML = `<div class="max-w-[85%] px-4 py-3 rounded-2xl text-sm font-medium ${sender === 'me' ? 'bg-indigo-600 text-white rounded-tr-none shadow-lg' : 'bg-white/5 border border-white/10 text-slate-200 rounded-tl-none'}">${text}</div>`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function addSystemMessage(text) {
            const box = document.getElementById('chat-window');
            const div = document.createElement('div');
            div.className = "text-center py-4 text-[10px] font-bold text-red-400 uppercase tracking-widest animate-pulse";
            div.innerText = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        // KEY LISTENERS
        document.getElementById('tag-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.target.value.trim() !== '') {
                window.addTag(e.target.value);
                e.target.value = '';
            }
        });
        document.getElementById('chat-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') window.sendMessage();
        });

        lucide.createIcons();
    </script>
</body>
</html>
