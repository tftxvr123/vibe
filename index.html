<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIBE | Wavelength Matching</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #000; color: #fff; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .screen { display: none; min-height: 100vh; flex-direction: column; position: relative; z-index: 10; }
        .screen.active { display: flex; }

        .pro-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: radial-gradient(circle at 50% -20%, #1e1b4b 0%, #000 85%); }
        .noise { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; opacity: 0.05; pointer-events: none; background-image: url('https://grainy-gradients.vercel.app/noise.svg'); }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 1.5rem; }
        .bento-card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 24px; padding: 1.5rem; }
        
        .pref-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); transition: all 0.2s ease; border-radius: 1rem; font-weight: 700; font-size: 11px; text-transform: uppercase; }
        .pref-btn.active { background: #6366f1; border-color: #818cf8; color: white; box-shadow: 0 0 20px rgba(79, 70, 229, 0.4); }

        .msg-me { background: #6366f1; border-radius: 1.25rem 1.25rem 0 1.25rem; align-self: flex-end; }
        .msg-them { background: #1e293b; border-radius: 1.25rem 1.25rem 1.25rem 0; align-self: flex-start; }
        
        @keyframes scan { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .radar-spin { animation: scan 4s linear infinite; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div class="pro-bg"></div>
    <div class="noise"></div>

    <nav class="fixed top-0 w-full z-50 h-16 border-b border-white/5 bg-black/50 backdrop-blur-md flex items-center justify-between px-6">
        <div class="flex items-center gap-2 cursor-pointer" onclick="location.reload()">
            <div class="w-7 h-7 bg-indigo-600 rounded flex items-center justify-center text-white shadow-lg"><i data-lucide="zap" class="w-4 h-4 fill-current"></i></div>
            <span class="text-lg font-bold tracking-tighter uppercase italic">VIBE</span>
        </div>
        <div class="flex items-center gap-2 bg-white/5 px-3 py-1 rounded-full border border-white/10">
            <span class="w-1 h-1 bg-green-500 rounded-full animate-pulse"></span>
            <span id="live-counter" class="text-[9px] font-bold uppercase tracking-widest text-slate-400">2,410 Live</span>
        </div>
    </nav>

    <section id="landing" class="screen active pt-32 px-6 items-center text-center">
        <div class="max-w-3xl">
            <h1 class="text-5xl md:text-7xl font-extrabold tracking-tighter leading-none mb-6 uppercase italic">Meet on your <br/><span class="text-indigo-500">wavelength.</span></h1>
            <p class="text-slate-400 text-base mb-10 max-w-sm mx-auto">India's industrial-grade anonymous chat engine.</p>
            <button onclick="showScreen('interests')" class="bg-white text-black px-12 py-5 rounded-2xl font-black text-lg uppercase tracking-tighter hover:bg-indigo-600 hover:text-white transition-all">Start Vibing</button>
            <div class="grid grid-cols-2 gap-3 mt-24 text-left opacity-50">
                <div class="bento-card col-span-2 md:col-span-1">
                    <h3 class="text-[9px] font-bold uppercase mb-2">Network</h3>
                    <div class="text-xl font-bold italic tracking-tighter text-indigo-400">98.2% Match</div>
                </div>
                <div class="bento-card col-span-2 md:col-span-1">
                    <h3 class="text-[9px] font-bold uppercase mb-2">Security</h3>
                    <p class="text-[10px] leading-tight">Ephemeral sessions active.</p>
                </div>
            </div>
        </div>
    </section>

    <section id="interests" class="screen pt-28 px-6 items-center">
        <div class="max-w-md w-full">
            <h2 class="text-3xl font-bold mb-8 uppercase italic text-center">Interests</h2>
            <div class="glass-card p-6 mb-8 shadow-2xl focus-within:border-indigo-500/50 transition-all">
                <div id="tag-container" class="flex flex-wrap gap-2 mb-4"></div>
                <input id="tag-input" type="text" placeholder="Type (Cinema, F1, AI)..." class="w-full bg-transparent outline-none text-xl font-medium py-1 text-white">
            </div>
            <button id="next-to-prefs" disabled onclick="showScreen('preferences')" class="w-full bg-indigo-600 py-5 rounded-2xl font-black text-lg uppercase shadow-xl disabled:opacity-10 transition-all">Continue</button>
        </div>
    </section>

    <section id="preferences" class="screen pt-28 px-6 items-center pb-20">
        <div class="max-w-md w-full space-y-6">
            <h2 class="text-3xl font-bold mb-4 text-center uppercase italic">Filters</h2>
            <div class="glass-card p-6">
                <label class="text-[10px] font-bold text-slate-500 uppercase block mb-4 text-center">Status Filter</label>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="setPref('marital', 'Single', this)" class="pref-btn active p-3">Single</button>
                    <button onclick="setPref('marital', 'Married', this)" class="pref-btn p-3">Married</button>
                    <button onclick="setPref('marital', 'Divorced', this)" class="pref-btn p-3">Divorced</button>
                </div>
            </div>
            <div class="glass-card p-6">
                <label class="text-[10px] font-bold text-slate-500 uppercase block mb-4 text-center">Style</label>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="setPref('style', 'Deep Talk', this)" class="pref-btn active p-3">Deep Talk</button>
                    <button onclick="setPref('style', 'Deep Naughty', this)" class="pref-btn p-3">Deep Naughty</button>
                </div>
            </div>
            <button onclick="startMatching()" class="w-full mt-10 bg-white text-black py-5 rounded-2xl font-black text-lg uppercase shadow-xl">Scan Wavelength</button>
        </div>
    </section>

    <section id="matching" class="screen items-center justify-center bg-black text-center p-6">
        <div class="relative w-56 h-56 flex items-center justify-center mb-12">
            <div class="absolute inset-0 border border-indigo-500/20 rounded-full radar-spin"></div>
            <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center animate-pulse"><i data-lucide="compass" class="w-8 h-8 text-white"></i></div>
        </div>
        <h2 class="text-3xl font-bold italic uppercase tracking-tighter">Searching</h2>
        <p class="text-indigo-400 text-[9px] font-bold uppercase tracking-[0.4em] mt-2">Establishing Secure Frequency</p>
        <button onclick="location.reload()" class="mt-20 px-8 py-3 bg-white/5 border border-white/10 rounded-xl text-[9px] font-bold uppercase tracking-widest hover:text-red-400">Cancel</button>
    </section>

    <section id="chat" class="screen bg-black">
        <header class="h-20 border-b border-white/5 flex items-center justify-between px-6 glass-nav sticky top-0 z-20">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center font-bold text-xs">V</div>
                <div class="font-bold text-sm italic uppercase tracking-tight" id="chat-pref">Stranger</div>
            </div>
            <button onclick="skipChat()" class="bg-red-500/10 border border-red-500/20 text-red-500 px-5 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest">Skip</button>
        </header>
        <div id="chat-window" class="flex-1 overflow-y-auto p-6 flex flex-col space-y-3 no-scrollbar pb-32"></div>
        <div class="p-4 bg-black border-t border-white/5 absolute bottom-0 w-full">
            <div class="max-w-2xl mx-auto flex gap-3 bg-white/5 p-2 rounded-2xl border border-white/10">
                <input id="chat-input" type="text" placeholder="Send a message..." class="flex-1 bg-transparent px-4 py-3 outline-none text-sm text-white font-medium">
                <button onclick="sendMessage()" class="bg-indigo-600 text-white w-12 h-12 rounded-xl flex items-center justify-center shadow-lg"><i data-lucide="arrow-up" class="w-5 h-5"></i></button>
            </div>
        </div>
    </section>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDjve9Lpih3Tl4mNGn1gxdZ6RQqONs7Bo4",
            authDomain: "vibe-78d6f.firebaseapp.com",
            databaseURL: "https://vibe-78d6f-default-rtdb.firebaseio.com",
            projectId: "vibe-78d6f",
            storageBucket: "vibe-78d6f.firebasestorage.app",
            messagingSenderId: "676783066321",
            appId: "1:676783066321:web:4b9535e39559df464b09f0"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myId = localStorage.getItem('vibe_uid') || 'u' + Math.random().toString(36).substr(2, 7);
        localStorage.setItem('vibe_uid', myId);
        let interests = [];
        let prefs = { marital: 'Single', style: 'Deep Talk' };
        let currentRoom = null;

        window.showScreen = (id) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            window.scrollTo(0,0);
            lucide.createIcons();
        };

        const tagInput = document.getElementById('tag-input');
        tagInput.addEventListener('keydown', (e) => {
            if(e.key === 'Enter' && tagInput.value.trim()){
                const val = tagInput.value.trim().toLowerCase();
                if(!interests.includes(val)){ interests.push(val); renderTags(); }
                tagInput.value = '';
            }
        });

        function renderTags() {
            const container = document.getElementById('tag-container');
            container.innerHTML = interests.map(t => `<div class="bg-indigo-600 px-3 py-1.5 rounded-xl text-[10px] font-bold flex items-center gap-2">${t} <i data-lucide="x" class="w-3 h-3 cursor-pointer" onclick="removeTag('${t}')"></i></div>`).join('');
            document.getElementById('next-to-prefs').disabled = interests.length < 1;
            lucide.createIcons();
        }

        window.removeTag = (t) => { interests = interests.filter(i => i !== t); renderTags(); }
        window.setPref = (type, val, btn) => {
            prefs[type] = val;
            btn.parentElement.parentElement.querySelectorAll('.pref-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        window.startMatching = () => {
            currentRoom = null;
            showScreen('matching');
            const myNotifyRef = db.ref(`notif/${myId}`);
            myNotifyRef.remove();

            myNotifyRef.on('value', (snap) => {
                const data = snap.val();
                if (data && data.roomId) {
                    myNotifyRef.off();
                    db.ref('queue').child(myId).remove();
                    joinChat(data.roomId, data.style);
                }
            });

            db.ref('queue').once('value', (snap) => {
                const users = snap.val();
                let peer = null;
                if (users) {
                    for (let uid in users) {
                        if (uid === myId) continue;
                        const shared = (users[uid].interests || []).some(i => interests.includes(i));
                        if (shared) { peer = uid; break; }
                    }
                }
                if (peer) {
                    const roomId = [myId, peer].sort().join('_');
                    db.ref(`rooms/${roomId}/status`).set('active');
                    db.ref(`rooms/${roomId}/messages`).remove();
                    db.ref(`notif/${peer}`).set({ roomId, style: prefs.style });
                    db.ref('queue').child(peer).remove();
                    joinChat(roomId, prefs.style);
                } else {
                    db.ref('queue').child(myId).set({ interests, time: Date.now() });
                }
            });
        };

        function joinChat(roomId, style) {
            currentRoom = roomId;
            showScreen('chat');
            document.getElementById('chat-pref').innerText = style + " Mode";
            document.getElementById('chat-window').innerHTML = '';
            document.getElementById('chat-input').disabled = false;

            const msgRef = db.ref(`rooms/${roomId}/messages`);
            msgRef.off();
            msgRef.on('child_added', (snap) => {
                const msg = snap.val();
                addUI(msg.sender === myId ? 'me' : 'stranger', msg.text);
            });

            const statusRef = db.ref(`rooms/${roomId}/status`);
            statusRef.on('value', (snap) => {
                if (snap.val() === 'ended') {
                    addUI('system', 'Stranger has left the wavelength.');
                    document.getElementById('chat-input').disabled = true;
                }
            });
        }

        window.sendMessage = () => {
            const input = document.getElementById('chat-input');
            const val = input.value.trim();
            if (!val || !currentRoom) return;
            db.ref(`rooms/${currentRoom}/messages`).push({ sender: myId, text: val });
            input.value = '';
        };

        window.skipChat = () => {
            if (currentRoom) {
                db.ref(`rooms/${currentRoom}/status`).set('ended');
            }
            setTimeout(() => { location.reload(); }, 100);
        };

        function addUI(sender, text) {
            const box = document.getElementById('chat-window');
            const div = document.createElement('div');
            if (sender === 'system') {
                div.className = "flex flex-col items-center py-10 w-full";
                div.innerHTML = `
                    <div class="text-[9px] font-bold text-red-500 uppercase tracking-widest animate-pulse">${text}</div>
                    <button onclick="location.reload()" class="mt-4 bg-white text-black px-6 py-2 rounded-xl text-[10px] font-black uppercase">Find New Vibe</button>
                `;
            } else {
                div.className = `max-w-[85%] px-4 py-2.5 text-sm font-medium ${sender === 'me' ? 'msg-me' : 'msg-them'}`;
                div.innerText = text;
            }
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        document.getElementById('chat-input').onkeydown = (e) => { if(e.key === 'Enter') sendMessage(); };
        setInterval(() => {
            const c = 2410 + Math.floor(Math.random() * 15);
            document.getElementById('live-counter').innerText = c.toLocaleString() + " Live";
        }, 5000);
        lucide.createIcons();
    </script>
</body>
</html>
