<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIBE | Wavelength Matching & Rooms</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #000; color: #fff; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .screen { display: none; min-height: 100vh; flex-direction: column; position: relative; z-index: 10; }
        .screen.active { display: flex; }
        .pro-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: radial-gradient(circle at 50% -20%, #1e1b4b 0%, #000 85%); }
        .noise { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; opacity: 0.05; pointer-events: none; background-image: url('https://grainy-gradients.vercel.app/noise.svg'); }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 1.5rem; }
        .pref-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); transition: all 0.2s ease; border-radius: 1rem; font-weight: 700; font-size: 11px; text-transform: uppercase; }
        .pref-btn.active { background: #6366f1; border-color: #818cf8; color: white; box-shadow: 0 0 20px rgba(79, 70, 229, 0.4); }
        .msg-me { background: #6366f1; border-radius: 1.25rem 1.25rem 0 1.25rem; align-self: flex-end; }
        .msg-them { background: #1e293b; border-radius: 1.25rem 1.25rem 1.25rem 0; align-self: flex-start; }
        @keyframes scan { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .radar-spin { animation: scan 4s linear infinite; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div class="pro-bg"></div>
    <div class="noise"></div>

    <!-- PERSISTENT NAV -->
    <nav id="top-nav" class="fixed top-0 w-full z-50 h-16 border-b border-white/5 bg-black/50 backdrop-blur-md flex items-center justify-between px-6">
        <div class="flex items-center gap-2 cursor-pointer" onclick="location.reload()">
            <div class="w-7 h-7 bg-indigo-600 rounded flex items-center justify-center text-white shadow-lg"><i data-lucide="zap" class="w-4 h-4 fill-current"></i></div>
            <span class="text-lg font-bold tracking-tighter uppercase italic text-white">VIBE</span>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="showScreen('rooms')" class="text-[10px] font-bold uppercase tracking-widest text-slate-400 hover:text-indigo-400">Rooms</button>
            <div class="flex items-center gap-2 bg-white/5 px-3 py-1 rounded-full border border-white/10">
                <span class="w-1 h-1 bg-green-500 rounded-full animate-pulse"></span>
                <span id="live-counter" class="text-[9px] font-bold uppercase tracking-widest text-slate-400">2,410 Live</span>
            </div>
        </div>
    </nav>

    <!-- SCREEN 1: LANDING -->
    <section id="landing" class="screen active pt-32 px-6 items-center text-center">
        <div class="max-w-3xl">
            <h1 class="text-5xl md:text-7xl font-extrabold tracking-tighter leading-none mb-6 uppercase italic text-white">Meet on your <br/><span class="text-indigo-500">wavelength.</span></h1>
            <p class="text-slate-400 text-base mb-10 max-w-sm mx-auto">India's industrial-grade anonymous chat engine. Connect through interests.</p>
            <button onclick="showScreen('interests')" class="bg-white text-black px-12 py-5 rounded-2xl font-black text-lg uppercase tracking-tighter hover:bg-indigo-600 hover:text-white transition-all shadow-2xl">Start Vibing</button>
            
            <div class="mt-24 w-full text-left">
                <h2 class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.3em] mb-6">Explore Vibe Rooms</h2>
                <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                    <div class="glass-card p-5 border-indigo-500/20" onclick="enterRoom('Married & Curious')">
                        <h4 class="font-bold text-xs uppercase mb-1">Married & Curious</h4>
                        <p class="text-[9px] text-indigo-400 font-bold">Featured</p>
                    </div>
                    <div class="glass-card p-5" onclick="showScreen('rooms')">
                        <h4 class="font-bold text-xs uppercase mb-1 text-white">Browse All</h4>
                        <p class="text-[9px] text-slate-500 font-bold">9+ Rooms</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- SCREEN: ROOM DIRECTORY -->
    <section id="rooms" class="screen pt-24 px-6 pb-20">
        <div class="max-w-2xl mx-auto w-full">
            <div class="flex items-center gap-4 mb-8">
                <button onclick="showScreen('landing')" class="text-slate-500 hover:text-white transition-all"><i data-lucide="chevron-left"></i></button>
                <h2 class="text-3xl font-black uppercase italic">Vibe <span class="text-indigo-500">Rooms</span></h2>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3" id="room-list"></div>
        </div>
    </section>

    <!-- SCREEN: ROOM FEED -->
    <section id="room-feed" class="screen pt-20 px-6 pb-24">
        <div class="max-w-2xl mx-auto w-full">
            <div class="flex items-center justify-between mb-8 sticky top-20 z-30 bg-black/50 backdrop-blur-md py-3 px-4 rounded-2xl border border-white/5">
                <button onclick="showScreen('rooms')" class="text-slate-500"><i data-lucide="chevron-left"></i></button>
                <h2 id="current-room-name" class="text-lg font-black uppercase italic text-indigo-500 tracking-tight">Room Name</h2>
                <button onclick="openCreatePost()" class="bg-indigo-600 p-2.5 rounded-xl text-white shadow-lg"><i data-lucide="plus" class="w-5 h-5"></i></button>
            </div>
            <div id="posts-container" class="space-y-6 text-left"></div>
        </div>
    </section>

    <!-- SCREEN 2: INTERESTS (WITH BACK BUTTON) -->
    <section id="interests" class="screen pt-28 px-6 items-center">
        <div class="max-w-md w-full">
            <div class="flex items-center gap-4 mb-8">
                <button onclick="showScreen('landing')" class="text-slate-500 hover:text-white transition-all"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
                <h2 class="text-3xl font-bold uppercase italic text-center flex-1">Interests</h2>
            </div>
            <div class="glass-card p-6 mb-8 shadow-2xl focus-within:border-indigo-500/50 transition-all">
                <div id="tag-container" class="flex flex-wrap gap-2 mb-4 text-left"></div>
                <input id="tag-input" type="text" placeholder="Type (Cinema, F1, AI)..." class="w-full bg-transparent outline-none text-xl font-medium py-1 text-white">
            </div>
            <button id="next-to-prefs" disabled onclick="showScreen('preferences')" class="w-full bg-indigo-600 py-5 rounded-2xl font-black text-lg uppercase shadow-xl disabled:opacity-10 transition-all">Continue</button>
        </div>
    </section>

    <!-- SCREEN 3: PREFERENCES (WITH BACK BUTTON) -->
    <section id="preferences" class="screen pt-28 px-6 items-center pb-20">
        <div class="max-w-md w-full">
            <div class="flex items-center gap-4 mb-8">
                <button onclick="showScreen('interests')" class="text-slate-500 hover:text-white transition-all"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
                <h2 class="text-3xl font-bold uppercase italic text-white text-center flex-1">Filters</h2>
            </div>
            <div class="glass-card p-6 mb-6">
                <label class="text-[10px] font-bold text-slate-500 uppercase block mb-4 text-center">Status Filter</label>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="setPref('marital', 'Single', this)" class="pref-btn active p-3">Single</button>
                    <button onclick="setPref('marital', 'Married', this)" class="pref-btn p-3">Married</button>
                    <button onclick="setPref('marital', 'Divorced', this)" class="pref-btn p-3">Divorced</button>
                </div>
            </div>
            <button onclick="startMatching()" class="w-full mt-10 bg-white text-black py-5 rounded-2xl font-black text-lg uppercase shadow-xl hover:bg-indigo-600 hover:text-white transition-all">Scan Wavelength</button>
        </div>
    </section>

    <!-- SCREEN 4: MATCHING (WITH FIXED CANCEL BUTTON) -->
    <section id="matching" class="screen items-center justify-center bg-black text-center p-6">
        <div class="relative w-56 h-56 flex items-center justify-center mb-12">
            <div class="absolute inset-0 border border-indigo-500/20 rounded-full radar-spin"></div>
            <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center animate-pulse"><i data-lucide="compass" class="w-8 h-8 text-white"></i></div>
        </div>
        <h2 class="text-3xl font-bold italic uppercase tracking-tighter text-white">Scanning...</h2>
        <button onclick="cancelMatch()" class="mt-20 px-10 py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl text-[10px] font-black uppercase tracking-widest transition-all shadow-lg shadow-red-600/20">
            Cancel Search
        </button>
    </section>

    <!-- SCREEN 5: CHAT (WITH FIXED SKIP BUTTON) -->
    <section id="chat" class="screen bg-black">
        <header class="h-20 border-b border-white/5 flex items-center justify-between px-6 glass-nav sticky top-0 z-20">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center font-bold text-xs text-white uppercase">V</div>
                <div class="font-bold text-sm italic text-white" id="chat-pref">Stranger</div>
            </div>
            <!-- BOLD RED SKIP BUTTON -->
            <button onclick="skipChat()" class="bg-red-600 hover:bg-red-700 text-white px-5 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest shadow-lg shadow-red-600/30 active:scale-95 transition-all">
                SKIP / NEXT
            </button>
        </header>
        <div id="chat-window" class="flex-1 overflow-y-auto p-6 flex flex-col space-y-3 no-scrollbar pb-32"></div>
        <div class="p-4 bg-black border-t border-white/5 absolute bottom-0 w-full">
            <div class="max-w-2xl mx-auto flex gap-3 bg-white/5 p-2 rounded-2xl border border-white/10">
                <input id="chat-input" type="text" placeholder="Type a message..." class="flex-1 bg-transparent px-4 py-3 outline-none text-sm text-white font-medium">
                <button onclick="sendMessage()" class="bg-indigo-600 text-white w-12 h-12 rounded-xl flex items-center justify-center shadow-lg"><i data-lucide="arrow-up" class="w-5 h-5"></i></button>
            </div>
        </div>
    </section>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyDjve9Lpih3Tl4mNGn1gxdZ6RQqONs7Bo4", authDomain: "vibe-78d6f.firebaseapp.com", databaseURL: "https://vibe-78d6f-default-rtdb.firebaseio.com", projectId: "vibe-78d6f", storageBucket: "vibe-78d6f.firebasestorage.app", messagingSenderId: "676783066321", appId: "1:676783066321:web:4b9535e39559df464b09f0" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myId = localStorage.getItem('vibe_uid') || 'u' + Math.random().toString(36).substr(2, 7);
        localStorage.setItem('vibe_uid', myId);
        let interests = [], prefs = { marital: 'Single', style: 'Deep Talk' }, currentRoom = null;

        window.showScreen = (id) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('top-nav').style.display = (id === 'landing' || id === 'rooms' || id === 'room-feed') ? 'flex' : 'none';
            if (id === 'rooms') renderRoomDirectory();
            window.scrollTo(0,0);
            lucide.createIcons();
        };

        // --- FIXED CANCEL MATCH ---
        window.cancelMatch = () => {
            db.ref(`notif/${myId}`).remove();
            db.ref('queue').child(myId).remove();
            showScreen('landing');
        };

        // --- FIXED SKIP CHAT ---
        window.skipChat = () => {
            if (currentRoom) {
                db.ref(`rooms/${currentRoom}/status`).set('ended');
            }
            // Explicitly clean up lobby data before redirecting
            db.ref(`notif/${myId}`).remove();
            db.ref('queue').child(myId).remove();
            showScreen('landing');
        };

        // --- MATCHMAKING ENGINE ---
        window.startMatching = () => {
            currentRoom = null;
            showScreen('matching');
            const myNotifyRef = db.ref(`notif/${myId}`);
            myNotifyRef.remove();
            myNotifyRef.on('value', (snap) => {
                const data = snap.val();
                if (data && data.roomId) {
                    myNotifyRef.off();
                    db.ref('queue').child(myId).remove();
                    joinChat(data.roomId, data.style);
                }
            });
            db.ref('queue').once('value', (snap) => {
                const users = snap.val();
                let peer = null;
                if (users) {
                    for (let uid in users) {
                        if (uid === myId) continue;
                        const shared = (users[uid].interests || []).some(i => interests.includes(i));
                        if (shared) { peer = uid; break; }
                    }
                }
                if (peer) {
                    const roomId = [myId, peer].sort().join('_');
                    db.ref(`rooms/${roomId}/status`).set('active');
                    db.ref(`rooms/${roomId}/messages`).remove();
                    db.ref(`notif/${peer}`).set({ roomId, style: prefs.style });
                    db.ref('queue').child(peer).remove();
                    joinChat(roomId, prefs.style);
                } else {
                    db.ref('queue').child(myId).set({ interests, time: Date.now() });
                }
            });
        };

        function joinChat(roomId, style) {
            currentRoom = roomId;
            showScreen('chat');
            document.getElementById('chat-pref').innerText = style + " Mode";
            document.getElementById('chat-window').innerHTML = '';
            document.getElementById('chat-input').disabled = false;

            const msgRef = db.ref(`rooms/${roomId}/messages`);
            msgRef.off();
            msgRef.on('child_added', (snap) => {
                const msg = snap.val();
                addUI(msg.sender === myId ? 'me' : 'stranger', msg.text);
            });

            const statusRef = db.ref(`rooms/${roomId}/status`);
            statusRef.on('value', (snap) => {
                if (snap.val() === 'ended') {
                    addUI('system', 'Stranger has left the wavelength.');
                    document.getElementById('chat-input').disabled = true;
                    statusRef.off();
                }
            });
        }

        window.sendMessage = () => {
            const input = document.getElementById('chat-input');
            const val = input.value.trim();
            if (!val || !currentRoom) return;
            db.ref(`rooms/${currentRoom}/messages`).push({ sender: myId, text: val });
            input.value = '';
        };

        function addUI(sender, text) {
            const box = document.getElementById('chat-window');
            const div = document.createElement('div');
            if (sender === 'system') {
                div.className = "flex flex-col items-center py-10 w-full";
                div.innerHTML = `<div class="text-[9px] font-bold text-red-500 uppercase py-4 animate-pulse">${text}</div><button onclick="location.reload()" class="mt-4 bg-white text-black px-6 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest">Find New</button>`;
            } else {
                div.className = `max-w-[85%] px-4 py-2.5 text-sm font-medium ${sender === 'me' ? 'msg-me' : 'msg-them'}`;
                div.innerText = text;
            }
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        // --- PRESERVED UTILS ---
        const VIBE_ROOMS = ['Married & Curious', 'Couples', 'First Experiences', 'Open Relationships', 'Dating & Connection', 'Fantasy & Roleplay', 'Relationship Advice', 'Experiences', 'Questions & Discussions'];
        function renderRoomDirectory() {
            const container = document.getElementById('room-list');
            container.innerHTML = VIBE_ROOMS.map(room => `<div class="glass-card p-6 flex justify-between items-center hover:border-indigo-500/50 transition-all cursor-pointer" onclick="enterRoom('${room}')"><h3 class="font-bold text-sm uppercase italic tracking-tight text-white">${room}</h3><i data-lucide="chevron-right" class="w-4 h-4 text-slate-500"></i></div>`).join('');
            lucide.createIcons();
        }
        window.enterRoom = (roomName) => { activeRoomName = roomName; document.getElementById('current-room-name').innerText = roomName; showScreen('room-feed'); loadRoomPosts(roomName); };
        function loadRoomPosts(roomName) {
            const container = document.getElementById('posts-container');
            container.innerHTML = '';
            db.ref(`room_posts/${roomName}`).limitToLast(20).on('value', snap => {
                const posts = snap.val() || {}; container.innerHTML = '';
                for (let id in posts) {
                    const div = document.createElement('div'); div.className = "glass-card p-5 space-y-4";
                    div.innerHTML = `<p class="text-sm text-slate-300 leading-relaxed">${posts[id].text}</p><div class="flex items-center justify-between border-t border-white/5 pt-4"><button class="flex items-center gap-1.5 text-[9px] font-bold text-slate-500 hover:text-indigo-400 transition-all"><i data-lucide="heart" class="w-3.5 h-3.5"></i> ${posts[id].likes || 0}</button><button class="text-[9px] text-slate-600 font-bold uppercase">Report</button></div>`;
                    container.insertAdjacentElement('afterbegin', div);
                }
                lucide.createIcons();
            });
        }
        const tagInput = document.getElementById('tag-input');
        tagInput.addEventListener('keydown', (e) => { if(e.key === 'Enter' && tagInput.value.trim()){ const val = tagInput.value.trim().toLowerCase(); if(!interests.includes(val)){ interests.push(val); renderTags(); } tagInput.value = ''; } });
        function renderTags() { const container = document.getElementById('tag-container'); container.innerHTML = interests.map(t => `<div class="bg-indigo-600 px-3 py-1.5 rounded-xl text-[10px] font-bold flex items-center gap-2">${t} <i data-lucide="x" class="w-3 h-3 cursor-pointer" onclick="removeTag('${t}')"></i></div>`).join(''); document.getElementById('next-to-prefs').disabled = interests.length < 1; lucide.createIcons(); }
        window.removeTag = (t) => { interests = interests.filter(i => i !== t); renderTags(); }
        window.setPref = (type, val, btn) => { prefs[type] = val; btn.parentElement.parentElement.querySelectorAll('.pref-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }
        document.getElementById('chat-input').onkeydown = (e) => { if(e.key === 'Enter') sendMessage(); };
        setInterval(() => { const c = 2410 + Math.floor(Math.random() * 15); document.getElementById('live-counter').innerText = c.toLocaleString() + " Live"; }, 5000);
        lucide.createIcons();
    </script>
</body>
</html>
